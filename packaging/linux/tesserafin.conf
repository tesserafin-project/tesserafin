# Tesserafin Server — service environment.
#
# This file is the only thing tesserafin.service reads. It is a package
# configuration file: an upgrade never overwrites your edits (dpkg conffile /
# rpm %config(noreplace)), and an uninstall never deletes your data.
#
# Apply changes with:  systemctl restart tesserafin

# Where the server keeps configuration it writes itself (system.xml, encoding.xml,
# network.xml, ...). Also the directory holding this file.
TESSERAFIN_CONFIG_DIR=/etc/tesserafin

# Persistent state: the database, metadata, user images, plugins. This is the
# directory that must survive upgrades AND uninstall.
TESSERAFIN_DATA_DIR=/var/lib/tesserafin

# Cache and transcoding workspace. Safe to delete while the service is stopped.
TESSERAFIN_CACHE_DIR=/var/cache/tesserafin

# Rolling application log files. The journal receives the same events.
TESSERAFIN_LOG_DIR=/var/log/tesserafin

# The bundled Tesserafin Web client, served at /web/.
TESSERAFIN_WEB_DIR=/usr/share/tesserafin/web

# The bundled Tesserafin FFmpeg runtime, built from source at a pinned commit.
# Point this elsewhere only if you deliberately want a different encoder; the
# server does NOT fall back to a distribution ffmpeg on $PATH, and refuses to
# start if this path is not a usable ffmpeg.
#
# The binary lives beside its own libraries: it carries RUNPATH=$ORIGIN/../lib
# and loads them from /usr/lib/tesserafin/ffmpeg/lib. Moving the executable
# without moving that directory breaks it.
TESSERAFIN_FFMPEG=/usr/lib/tesserafin/ffmpeg/bin/ffmpeg

# Extra command-line arguments, appended verbatim. Empty by default.
TESSERAFIN_EXTRA_ARGS=
