# Tesserafin — guided container install (#89 / [A3])
#
# Zero-friction self-hosting path: pull a prebuilt image and start. No source
# checkout, no build, no compiler. See docs/container/A3-guided-install.md.
#
#   docker compose up -d      # start (first run creates all state)
#   docker compose down       # stop + remove the container (named volumes are KEPT)
#
# Defaults use Docker NAMED VOLUMES for /config, /data and /cache. A fresh named
# volume is initialised by Docker with the image's own 10000:10000 ownership, so
# the non-root server can write to it with no manual chown. NAS users who prefer
# host folders should use the documented bind-mount example instead (see the guide).
services:
  tesserafin:
    # IMMUTABLE by default, and deliberately a DIGEST (#92 / [A6]). Never
    # `latest`, `preview`, or a moving major/minor tag: with one of those a
    # `docker compose pull` could change your version — possibly across a schema
    # migration — at a moment you did not choose. A digest cannot be re-pointed.
    #
    # This is the Tesserafin Server 1.0 development baseline, tag
    # `1.0.0-dev.fe2bd88fc02f`, built from commit
    # `fe2bd88fc02f5e9fadf2e5d25ee80c6b0495585d`, bundling Tesserafin Web
    # `c4d323d6bf397067869a755972bd21df3dc39315`. It reports version `1.0.0`.
    #
    # It supersedes `1.0.0-dev.28ace1b74f42` (`sha256:636c3038a7eb…`), the
    # accepted B2 presentation/responsive/a11y release candidate
    # (tesserafin-project/tesserafin-web#55). That candidate's presentation
    # evidence still stands, but the image carried three third-party metadata
    # provider credentials inherited from upstream, compiled into
    # `Tesserafin.Providers.dll`:
    #
    #   SUPERSEDED — contains inherited upstream provider credentials; do not use
    #
    # That digest stays published and immutable — it is not deleted — but it must
    # not be an installation default. This image is built from the same tree with
    # those credentials removed; TheMovieDb, TheAudioDB and OMDb are now
    # operator-supplied only (docs/metadata-provider-keys.md) and nothing else
    # about the build changed. See tesserafin-project/tesserafin#174.
    #
    # The canonical v1+ package is `ghcr.io/tesserafin-project/tesserafin-server`.
    # `ghcr.io/tesserafin-project/tesserafin` is the frozen pre-v1 archive and
    # never receives another tag (docs/versioning-policy.md §2).
    #
    # Override with `TESSERAFIN_IMAGE=... docker compose up -d` or a .env file.
    # Moving channels are an explicit opt-in; the risks and the upgrade procedure
    # are in docs/container/A6-versioning-and-upgrades.md.
    image: ${TESSERAFIN_IMAGE:-ghcr.io/tesserafin-project/tesserafin-server@sha256:133e5e3a6afb877641a2519a96f94a71e08db43361d992bc92ffd0224b86a950}
    container_name: tesserafin
    # The image already runs as the fixed non-root identity 10000:10000; stated
    # here so the security posture is visible in the compose file itself.
    user: "10000:10000"
    restart: unless-stopped
    ports:
      # host:container — the server listens on 8096 inside the container.
      - "8096:8096"
    volumes:
      - tesserafin_config:/config
      - tesserafin_data:/data
      - tesserafin_cache:/cache
      # Your media library, mounted READ-ONLY. Point TESSERAFIN_MEDIA at your
      # library root (an absolute host path, or a NAS share). Default ./media is
      # created empty on first run so the stack starts before you have media.
      - ${TESSERAFIN_MEDIA:-./media}:/media:ro
    environment:
      # Minimum log level for the container's JSON logs (#91 / [A5]). Valid values:
      # Verbose, Debug, Information, Warning, Error, Fatal. Change it and re-run
      # `docker compose up -d` — no rebuild, no file to edit inside the volume.
      # An unrecognised value is ignored with a structured warning, not a crash.
      TESSERAFIN_LOG_LEVEL: ${TESSERAFIN_LOG_LEVEL:-Information}
      # Console rendering: `json` (the image default, one JSON object per line) or
      # `text`. Leave it alone unless you are reading the logs by eye.
      TESSERAFIN_LOG_FORMAT: ${TESSERAFIN_LOG_FORMAT:-json}
    # The container reports its own health: the image declares a HEALTHCHECK that
    # polls /health, which answers 200 only when the server is up AND its database
    # answered a real query. `docker compose ps` shows it as (healthy).
    #
    # No privileged mode, no Docker socket, no host networking and no GPU devices.
    # Metrics are intentionally not part of this image yet — see #91 (deferred to
    # Phase F). Versioning/upgrades are #92.
    #
    # No GPU is mapped here ON PURPOSE, and nothing is missing as a result: the
    # server probes for hardware at every start and transcodes in software when
    # it finds none, with no configuration at all. If you have a Linux host with
    # a VAAPI-capable GPU and want to use it, layer the opt-in override on top:
    #
    #   docker compose -f docker-compose.yml -f docker-compose.vaapi.yml up -d
    #
    # See docs/container/A4-hardware-acceleration.md (#90).
    security_opt:
      - no-new-privileges:true

volumes:
  tesserafin_config:
  tesserafin_data:
  tesserafin_cache:
