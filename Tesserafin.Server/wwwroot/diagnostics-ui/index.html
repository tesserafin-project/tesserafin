<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reefin — Playback Diagnostics</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --bg-panel: #1c1f25;
    --bg-panel-raised: #23262e;
    --border: #2e323b;
    --text: #d8dbe0;
    --text-dim: #8a8f99;
    --accent: #5aa9e6;
    --accent-dim: #3d7ab0;
    --ok: #4caf7d;
    --ok-bg: rgba(76, 175, 125, 0.12);
    --warn: #d9a441;
    --warn-bg: rgba(217, 164, 65, 0.12);
    --bad: #d9605a;
    --bad-bg: rgba(217, 96, 90, 0.14);
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 16px 0 0;
    color: var(--text);
    white-space: nowrap;
  }

  header .spacer { flex: 1 1 auto; }

  header .field-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="text"], input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12px;
    width: 260px;
  }

  button {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent-dim); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { border-color: var(--accent-dim); color: var(--accent); }

  label.checkbox {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  main {
    padding: 18px 20px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  #banner {
    display: none;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  #banner.error { display: block; background: var(--bad-bg); border: 1px solid var(--bad); color: #f2b8b5; }
  #banner.info { display: block; background: var(--bg-panel-raised); border: 1px solid var(--border); color: var(--text-dim); }

  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 24px 0 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:hover { background: var(--bg-panel-raised); }
  tbody tr.clickable { cursor: pointer; }

  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--text-dim); }

  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.neutral { background: var(--bg-panel-raised); color: var(--text-dim); border: 1px solid var(--border); }

  .tag {
    display: inline-block;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    margin: 1px 3px 1px 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
  }

  #empty-state, #loading-state {
    padding: 40px 0;
    text-align: center;
    color: var(--text-dim);
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .panel-head .title { font-size: 15px; font-weight: 600; }
  .panel-head .spacer { flex: 1 1 auto; }

  .compare-grid {
    display: grid;
    grid-template-columns: 150px 1fr 1fr;
    gap: 0;
    font-size: 13px;
  }

  .compare-grid > div {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .compare-grid .col-head {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .compare-grid .row-label { color: var(--text-dim); font-size: 12px; }
  .compare-grid .cell { font-family: var(--mono); font-size: 12px; word-break: break-word; }
  .compare-grid .cell.diff { background: var(--bad-bg); border-radius: 4px; }
  .compare-grid .cell.same { background: transparent; }

  .no-diagnostic-note {
    color: var(--text-dim);
    font-style: italic;
    padding: 10px 0;
  }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li {
    display: flex;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .timeline li .stage { min-width: 140px; font-weight: 500; }
  .timeline li .at { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }

  details { margin-top: 10px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  pre.raw {
    background: #0e1013;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    max-height: 400px;
  }

  .reason-tree { margin: 0; padding-left: 16px; }
  .reason-tree li { margin: 3px 0; }
  .reason-node-head { font-family: var(--mono); font-size: 12px; }
  .reason-node-detail { color: var(--text-dim); font-size: 11px; margin-left: 4px; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    padding: 30px 0 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Reefin · Playback Diagnostics</h1>
  <div class="spacer"></div>
  <div class="field-group">
    <input type="password" id="token-input" placeholder="Access token (MediaBrowser Token)" autocomplete="off">
    <button id="save-token-btn">Save token</button>
  </div>
  <label class="checkbox">
    <input type="checkbox" id="auto-refresh-toggle">
    Auto-refresh (5s)
  </label>
  <button id="refresh-btn" class="primary">Refresh</button>
</header>

<main>
  <div id="banner"></div>

  <section id="list-view">
    <h2>Active playback sessions</h2>
    <div id="loading-state" style="display:none;">Loading…</div>
    <div id="empty-state" style="display:none;">No active playback sessions.</div>
    <table id="sessions-table" style="display:none;">
      <thead>
        <tr>
          <th>Id</th>
          <th>Kind</th>
          <th>Method</th>
          <th>Item</th>
          <th>Client</th>
          <th>Age</th>
          <th>Diagnostic</th>
        </tr>
      </thead>
      <tbody id="sessions-tbody"></tbody>
    </table>
  </section>

  <section id="detail-view" style="display:none;"></section>

  <footer>Reefin admin-only diagnostics UI · not part of the stable API contract · PR114</footer>
</main>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Config / API base resolution
  // ---------------------------------------------------------------------

  var PAGE_MARKER = "/diagnostics-ui/";
  var pathIdx = window.location.pathname.indexOf(PAGE_MARKER);
  var API_BASE = pathIdx >= 0 ? window.location.pathname.slice(0, pathIdx) : "";
  var SESSIONS_URL = API_BASE + "/System/PlaybackDiagnostics/Sessions";

  var TOKEN_KEY = "reefin.diagnosticsUi.token";
  var AUTO_REFRESH_KEY = "reefin.diagnosticsUi.autoRefresh";
  var REFRESH_INTERVAL_MS = 5000;

  var state = {
    sessions: [],
    selectedId: null,
    detail: null,
    autoRefreshTimer: null
  };

  // ---------------------------------------------------------------------
  // DOM handles
  // ---------------------------------------------------------------------

  var el = {
    banner: document.getElementById("banner"),
    tokenInput: document.getElementById("token-input"),
    saveTokenBtn: document.getElementById("save-token-btn"),
    autoRefreshToggle: document.getElementById("auto-refresh-toggle"),
    refreshBtn: document.getElementById("refresh-btn"),
    listView: document.getElementById("list-view"),
    detailView: document.getElementById("detail-view"),
    loadingState: document.getElementById("loading-state"),
    emptyState: document.getElementById("empty-state"),
    sessionsTable: document.getElementById("sessions-table"),
    sessionsTbody: document.getElementById("sessions-tbody")
  };

  // ---------------------------------------------------------------------
  // Token handling
  // ---------------------------------------------------------------------

  function getToken() {
    return window.localStorage.getItem(TOKEN_KEY) || "";
  }

  function setToken(token) {
    if (token) {
      window.localStorage.setItem(TOKEN_KEY, token);
    } else {
      window.localStorage.removeItem(TOKEN_KEY);
    }
  }

  el.tokenInput.value = getToken();
  el.saveTokenBtn.addEventListener("click", function () {
    setToken(el.tokenInput.value.trim());
    showBanner("info", "Token saved. Refreshing…");
    loadCurrentView();
  });
  el.tokenInput.addEventListener("keydown", function (evt) {
    if (evt.key === "Enter") {
      el.saveTokenBtn.click();
    }
  });

  function authHeaders() {
    var token = getToken();
    var headers = { "Accept": "application/json" };
    if (token) {
      headers["Authorization"] = 'MediaBrowser Client="Reefin Diagnostics UI", Device="Browser", DeviceId="reefin-diagnostics-ui", Version="1", Token="' + token + '"';
    }
    return headers;
  }

  // ---------------------------------------------------------------------
  // Banner / loading helpers
  // ---------------------------------------------------------------------

  function showBanner(kind, message) {
    el.banner.className = kind;
    el.banner.textContent = message;
  }

  function clearBanner() {
    el.banner.className = "";
    el.banner.textContent = "";
  }

  function describeFetchError(err, response) {
    if (response) {
      if (response.status === 401 || response.status === 403) {
        return "Unauthorized (HTTP " + response.status + "). Check that the access token belongs to an elevated (admin) account.";
      }
      return "Request failed: HTTP " + response.status + " " + response.statusText;
    }
    return "Request failed: " + (err && err.message ? err.message : String(err));
  }

  // ---------------------------------------------------------------------
  // Fetch helpers
  // ---------------------------------------------------------------------

  function fetchJson(url) {
    return fetch(url, { headers: authHeaders() }).then(function (response) {
      if (!response.ok) {
        return response.text().catch(function () { return ""; }).then(function (body) {
          var e = new Error(describeFetchError(null, response));
          e.response = response;
          e.body = body;
          throw e;
        });
      }
      return response.json();
    });
  }

  // ---------------------------------------------------------------------
  // Formatting helpers
  // ---------------------------------------------------------------------

  function humanAge(isoTimestamp) {
    if (!isoTimestamp) { return "—"; }
    var ms = Date.now() - new Date(isoTimestamp).getTime();
    if (ms < 0) { ms = 0; }
    var s = Math.floor(ms / 1000);
    if (s < 60) { return s + "s ago"; }
    var m = Math.floor(s / 60);
    if (m < 60) { return m + "m ago"; }
    var h = Math.floor(m / 60);
    var remM = m % 60;
    if (h < 24) { return h + "h" + (remM ? remM + "m" : "") + " ago"; }
    var d = Math.floor(h / 24);
    return d + "d ago";
  }

  function formatTimestamp(isoTimestamp) {
    if (!isoTimestamp) { return "—"; }
    var d = new Date(isoTimestamp);
    return isNaN(d.getTime()) ? String(isoTimestamp) : d.toISOString().replace("T", " ").replace("Z", " UTC");
  }

  function shortId(id) {
    if (!id) { return "—"; }
    return String(id).slice(0, 8);
  }

  function fmt(value) {
    if (value === null || value === undefined || value === "") { return "—"; }
    return String(value);
  }

  function fmtResolution(res) {
    return res ? (res.Width + "×" + res.Height) : "—";
  }

  function fmtBitrate(bps) {
    if (bps === null || bps === undefined) { return "—"; }
    var n = Number(bps);
    if (n >= 1000000) { return (n / 1000000).toFixed(2) + " Mbps"; }
    if (n >= 1000) { return (n / 1000).toFixed(0) + " kbps"; }
    return n + " bps";
  }

  function fmtOutput(output) {
    if (!output) { return null; }
    return {
      Container: fmt(output.Container),
      VideoCodec: fmt(output.VideoCodec),
      AudioCodec: fmt(output.AudioCodec),
      Resolution: fmtResolution(output.Resolution),
      VideoRange: fmt(output.VideoRange),
      AudioChannels: fmt(output.AudioChannels),
      TotalBitrate: fmtBitrate(output.TotalBitrate),
      VideoBitrate: fmtBitrate(output.VideoBitrate),
      AudioBitrate: fmtBitrate(output.AudioBitrate),
      Protocol: fmt(output.Protocol),
      SubtitleFormat: fmt(output.SubtitleFormat)
    };
  }

  function fmtSelectedStreams(streams) {
    if (!streams) { return { Video: "—", Audio: "—", Subtitle: "—" }; }
    var subtitle = streams.Subtitle ? (streams.Subtitle.Index + " (" + streams.Subtitle.Delivery + ")") : "none";
    return {
      Video: streams.Video === null || streams.Video === undefined ? "—" : String(streams.Video),
      Audio: streams.Audio === null || streams.Audio === undefined ? "—" : String(streams.Audio),
      Subtitle: subtitle
    };
  }

  function fmtTags(list) {
    if (!list || list.length === 0) { return "<span class=\"dim\">none</span>"; }
    return list.map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function divergenceBadgeClass(divergenceClass) {
    switch (divergenceClass) {
      case "Equivalent":
      case "ExpectedImprovement":
        return "ok";
      case "KnownV2Limitation":
        return "warn";
      case "PotentialRegression":
      case "Unexplained":
        return "bad";
      default:
        return "neutral";
    }
  }

  // ---------------------------------------------------------------------
  // List view
  // ---------------------------------------------------------------------

  function loadSessionList() {
    el.detailView.style.display = "none";
    el.listView.style.display = "";
    el.loadingState.style.display = "";
    el.emptyState.style.display = "none";
    el.sessionsTable.style.display = "none";
    clearBanner();

    return fetchJson(SESSIONS_URL).then(function (items) {
      state.sessions = items || [];
      renderSessionList();
    }).catch(function (err) {
      el.loadingState.style.display = "none";
      showBanner("error", describeFetchError(err, err.response));
    });
  }

  function renderSessionList() {
    el.loadingState.style.display = "none";

    if (state.sessions.length === 0) {
      el.emptyState.style.display = "";
      el.sessionsTable.style.display = "none";
      return;
    }

    el.emptyState.style.display = "none";
    el.sessionsTable.style.display = "";

    var rows = state.sessions.map(function (item) {
      var s = item.Session;
      var diagnosticBadge = item.HasDiagnostic
        ? '<span class="badge ok">available</span>'
        : '<span class="badge neutral">none</span>';
      return "<tr class=\"clickable\" data-id=\"" + escapeHtml(s.Id) + "\">" +
        '<td class="mono">' + escapeHtml(shortId(s.Id)) + "</td>" +
        "<td>" + escapeHtml(s.Kind) + "</td>" +
        "<td>" + escapeHtml(s.Method) + "</td>" +
        '<td class="mono dim">' + escapeHtml(shortId(item.ItemId)) + "</td>" +
        '<td class="mono dim">' + escapeHtml(fmt(item.DeviceId)) + "</td>" +
        '<td class="dim">' + escapeHtml(humanAge(s.CreatedAt)) + "</td>" +
        "<td>" + diagnosticBadge + "</td>" +
        "</tr>";
    });

    el.sessionsTbody.innerHTML = rows.join("");

    Array.prototype.forEach.call(el.sessionsTbody.querySelectorAll("tr[data-id]"), function (row) {
      row.addEventListener("click", function () {
        openDetail(row.getAttribute("data-id"));
      });
    });
  }

  // ---------------------------------------------------------------------
  // Detail view
  // ---------------------------------------------------------------------

  function openDetail(id) {
    state.selectedId = id;
    window.location.hash = "session/" + id;
    loadDetail();
  }

  function closeDetail() {
    state.selectedId = null;
    state.detail = null;
    window.location.hash = "";
    loadSessionList();
  }

  function loadDetail() {
    if (!state.selectedId) { return Promise.resolve(); }
    el.listView.style.display = "none";
    el.detailView.style.display = "";
    el.detailView.innerHTML = '<div id="loading-state">Loading…</div>';
    clearBanner();

    return fetchJson(SESSIONS_URL + "/" + encodeURIComponent(state.selectedId)).then(function (detail) {
      state.detail = detail;
      renderDetail(detail);
    }).catch(function (err) {
      if (err.response && err.response.status === 404) {
        el.detailView.innerHTML = '<div class="panel">Session not found — it may have ended. <button id="back-btn">Back to list</button></div>';
        document.getElementById("back-btn").addEventListener("click", closeDetail);
        return;
      }
      el.detailView.innerHTML = "";
      showBanner("error", describeFetchError(err, err.response));
    });
  }

  function renderDetail(d) {
    var html = "";

    html += '<div class="panel-head">';
    html += '<button id="back-btn">&larr; Back</button>';
    html += '<span class="title mono">' + escapeHtml(shortId(d.Id)) + "</span>";
    html += "<span class=\"badge neutral\">" + escapeHtml(d.Kind) + "</span>";
    html += '<span class="dim">created ' + escapeHtml(formatTimestamp(d.CreatedAt)) + "</span>";
    html += '<span class="dim">updated ' + escapeHtml(formatTimestamp(d.UpdatedAt)) + "</span>";
    html += '<div class="spacer"></div>';
    if (d.Comparison) {
      html += '<button id="export-fixture-btn" class="primary">Export fixture</button>';
    }
    html += "</div>";

    // Divergence banner
    if (d.Comparison) {
      html += '<div class="panel">';
      html += '<span class="badge ' + divergenceBadgeClass(d.Comparison.DivergenceClass) + '">' + escapeHtml(d.Comparison.DivergenceClass) + "</span> ";
      html += '<span>' + escapeHtml(d.Comparison.DivergenceSummary || "") + "</span>";
      html += "</div>";
    } else {
      html += '<div class="panel"><div class="no-diagnostic-note">No shadow diagnostic retained for this session — the v2 comparison is unavailable (shadow mode was off, or the session predates diagnostic retention). Only the live legacy decision is shown below.</div></div>';
    }

    // Comparison grid
    html += '<h2>Live (legacy) vs. v2 decision</h2>';
    html += '<div class="panel">' + renderComparisonGrid(d) + "</div>";

    // Timeline
    html += '<h2>Timeline</h2>';
    html += '<div class="panel">' + renderTimeline(d.Timeline) + "</div>";

    // Raw diagnostic (collapsible)
    if (d.Comparison) {
      html += '<details><summary>Raw shadow diagnostic (request context, capabilities, source snapshot, full v2 reasoning tree)</summary>';
      html += '<div class="panel">';
      html += "<h2>V2 reasoning tree</h2>";
      html += renderReasoningTree(d.Reasoning);
      html += "<h2>Request context</h2><pre class=\"raw\">" + escapeHtml(JSON.stringify(d.RequestContext, null, 2)) + "</pre>";
      html += "<h2>Client capabilities</h2><pre class=\"raw\">" + escapeHtml(JSON.stringify(d.Capabilities, null, 2)) + "</pre>";
      html += "<h2>Source snapshot</h2><pre class=\"raw\">" + escapeHtml(JSON.stringify(d.SourceSnapshot, null, 2)) + "</pre>";
      html += "</div></details>";
    }

    el.detailView.innerHTML = html;

    document.getElementById("back-btn").addEventListener("click", closeDetail);
    var exportBtn = document.getElementById("export-fixture-btn");
    if (exportBtn) {
      exportBtn.addEventListener("click", function () { exportFixture(d.Id); });
    }
  }

  function comparisonRow(label, legacyVal, v2Val, hasComparison) {
    var same = hasComparison && legacyVal === v2Val;
    var legacyCellClass = "cell";
    var v2CellClass = "cell" + (hasComparison ? (same ? " same" : " diff") : "");
    return '<div class="row-label">' + escapeHtml(label) + "</div>" +
      '<div class="' + legacyCellClass + '">' + escapeHtml(legacyVal) + "</div>" +
      '<div class="' + v2CellClass + '">' + (hasComparison ? escapeHtml(v2Val) : '<span class="dim">n/a</span>') + "</div>";
  }

  function renderComparisonGrid(d) {
    var legacyOutput = fmtOutput(d.Output) || {};
    var legacyStreams = fmtSelectedStreams(d.SelectedStreams);
    var hasComparison = !!d.Comparison;
    var v2Output = hasComparison ? (fmtOutput(d.Comparison.V2Output) || {}) : {};
    var v2Streams = hasComparison ? fmtSelectedStreams(d.Comparison.V2SelectedStreams) : {};

    var rows = "";
    rows += comparisonRow("Method", d.Method, hasComparison ? d.Comparison.V2Method : "", hasComparison);
    rows += comparisonRow("Container", legacyOutput.Container, v2Output.Container, hasComparison);
    rows += comparisonRow("Video codec", legacyOutput.VideoCodec, v2Output.VideoCodec, hasComparison);
    rows += comparisonRow("Audio codec", legacyOutput.AudioCodec, v2Output.AudioCodec, hasComparison);
    rows += comparisonRow("Resolution", legacyOutput.Resolution, v2Output.Resolution, hasComparison);
    rows += comparisonRow("Video range", legacyOutput.VideoRange, v2Output.VideoRange, hasComparison);
    rows += comparisonRow("Audio channels", legacyOutput.AudioChannels, v2Output.AudioChannels, hasComparison);
    rows += comparisonRow("Video bitrate", legacyOutput.VideoBitrate, v2Output.VideoBitrate, hasComparison);
    rows += comparisonRow("Audio bitrate", legacyOutput.AudioBitrate, v2Output.AudioBitrate, hasComparison);
    rows += comparisonRow("Total bitrate", legacyOutput.TotalBitrate, v2Output.TotalBitrate, hasComparison);
    rows += comparisonRow("Protocol", legacyOutput.Protocol, v2Output.Protocol, hasComparison);
    rows += comparisonRow("Subtitle format", legacyOutput.SubtitleFormat, v2Output.SubtitleFormat, hasComparison);
    rows += comparisonRow("Video stream", legacyStreams.Video, v2Streams.Video, hasComparison);
    rows += comparisonRow("Audio stream", legacyStreams.Audio, v2Streams.Audio, hasComparison);
    rows += comparisonRow("Subtitle stream", legacyStreams.Subtitle, v2Streams.Subtitle, hasComparison);

    var grid = '<div class="compare-grid">';
    grid += '<div class="col-head"></div><div class="col-head">Live (legacy)</div><div class="col-head">Decision v2</div>';
    grid += rows;
    grid += "</div>";

    // Transforms + reasons render as tag lists / tree below the grid, since they are lists rather
    // than scalar cells.
    grid += '<div class="compare-grid">';
    grid += '<div class="row-label">Transforms</div>';
    grid += '<div class="cell">' + fmtTags(d.Transforms) + "</div>";
    grid += '<div class="cell">' + (hasComparison ? fmtTags(d.Comparison.V2Transforms) : '<span class="dim">n/a</span>') + "</div>";
    grid += '<div class="row-label">Reasons</div>';
    grid += '<div class="cell">' + fmtTags(d.Reasons) + "</div>";
    grid += '<div class="cell">' + (hasComparison ? renderReasoningSummary(d.Reasoning) : '<span class="dim">n/a</span>') + "</div>";
    grid += "</div>";

    return grid;
  }

  function renderReasoningSummary(reasoning) {
    if (!reasoning) { return '<span class="dim">—</span>'; }
    // Flat top-level tags for the compact comparison cell; the full causal tree is available in the
    // collapsible raw diagnostic section below.
    var codes = [];
    (function collect(node) {
      if (!node) { return; }
      codes.push(node.Code);
      (node.Children || []).forEach(collect);
    })(reasoning);
    return fmtTags(codes);
  }

  function renderReasoningTree(node) {
    if (!node) { return '<div class="dim">No reasoning tree retained.</div>'; }
    return "<ul class=\"reason-tree\">" + renderReasonNode(node) + "</ul>";
  }

  function renderReasonNode(node) {
    var subject = node.Subject || {};
    var subjectLabel = subject.Kind || "";
    if (subject.StreamIndex !== null && subject.StreamIndex !== undefined) { subjectLabel += "[" + subject.StreamIndex + "]"; }
    if (subject.SourceId) { subjectLabel += "[" + subject.SourceId + "]"; }
    var head = '<div class="reason-node-head"><span class="tag">' + escapeHtml(node.Code) + '</span> ' +
      escapeHtml(node.Outcome) + ' <span class="dim">(' + escapeHtml(subjectLabel) + ')</span>' +
      (node.Detail ? '<span class="reason-node-detail">' + escapeHtml(node.Detail) + "</span>" : "") +
      "</div>";
    var children = (node.Children || []).map(function (c) { return "<li>" + renderReasonNode(c) + "</li>"; }).join("");
    return head + (children ? "<ul class=\"reason-tree\">" + children + "</ul>" : "");
  }

  function renderTimeline(timeline) {
    if (!timeline || timeline.length === 0) {
      return '<div class="dim">No timeline entries.</div>';
    }
    var items = timeline.map(function (entry) {
      return "<li><span class=\"stage\">" + escapeHtml(entry.Stage) + "</span><span class=\"at\">" + escapeHtml(formatTimestamp(entry.At)) + "</span></li>";
    }).join("");
    return '<ul class="timeline">' + items + "</ul>";
  }

  // ---------------------------------------------------------------------
  // Fixture export
  // ---------------------------------------------------------------------

  function exportFixture(id) {
    fetch(SESSIONS_URL + "/" + encodeURIComponent(id) + "/Fixture", { headers: authHeaders() })
      .then(function (response) {
        if (!response.ok) {
          throw Object.assign(new Error(describeFetchError(null, response)), { response: response });
        }
        return response.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "playback-fixture-" + shortId(id) + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      })
      .catch(function (err) {
        showBanner("error", "Fixture export failed: " + describeFetchError(err, err.response));
      });
  }

  // ---------------------------------------------------------------------
  // Refresh / auto-refresh / routing
  // ---------------------------------------------------------------------

  function loadCurrentView() {
    return state.selectedId ? loadDetail() : loadSessionList();
  }

  el.refreshBtn.addEventListener("click", loadCurrentView);

  function setAutoRefresh(enabled) {
    window.localStorage.setItem(AUTO_REFRESH_KEY, enabled ? "1" : "0");
    if (state.autoRefreshTimer) {
      window.clearInterval(state.autoRefreshTimer);
      state.autoRefreshTimer = null;
    }
    if (enabled) {
      state.autoRefreshTimer = window.setInterval(loadCurrentView, REFRESH_INTERVAL_MS);
    }
  }

  el.autoRefreshToggle.addEventListener("change", function () {
    setAutoRefresh(el.autoRefreshToggle.checked);
  });
  el.autoRefreshToggle.checked = window.localStorage.getItem(AUTO_REFRESH_KEY) === "1";
  setAutoRefresh(el.autoRefreshToggle.checked);

  function routeFromHash() {
    var hash = window.location.hash.replace(/^#/, "");
    var match = /^session\/(.+)$/.exec(hash);
    state.selectedId = match ? decodeURIComponent(match[1]) : null;
  }

  window.addEventListener("hashchange", function () {
    routeFromHash();
    loadCurrentView();
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------

  routeFromHash();
  loadCurrentView();
})();
</script>
</body>
</html>
