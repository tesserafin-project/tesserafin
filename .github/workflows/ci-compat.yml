name: ABI Compatibility

on:
  pull_request:
    branches:
      - master
    # Deliberately NO paths-ignore. ci-tests.yml carries one for minute
    # economy; applying the same filter here would let a code-only pull
    # request skip ABI checking whenever its file list happened to match.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  # The self-test. It proves, on the same runner image that judges the pull
  # request, that the gate turns red for a removed public member, an
  # incompatible signature, a missing assembly on either side, a shrunken or
  # malformed manifest, and an ApiCompat process failure — and stays green
  # for identical and additive APIs. A red verdict inside these controls is
  # the EXPECTED result and is what makes this job pass; the fixtures are
  # synthetic class libraries built under the runner's temporary directory
  # and are never part of the server or its public ABI.
  abi-controls:
    name: ABI - Controls
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Run the deterministic ABI controls
        run: ./ci/tests/abi-compat.test.sh

  abi-head:
    name: ABI - HEAD
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build head
        run: dotnet build Tesserafin.Server -c Release -o ./abi-build

      # Fails the job BEFORE the upload if a protected assembly is absent, so
      # a truncated artifact can never reach the comparison and be mistaken
      # for "nothing to compare".
      - name: Stage the protected assemblies
        run: ./ci/abi-stage.sh ./abi-build ./abi-stage head

      - name: Upload head
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-head-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: abi-stage/

  abi-base:
    name: ABI - BASE
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      # fetch-depth: 0 so the merge base of this pull request is present in
      # the clone. Everything below stays inside the BASE repository: the
      # head commit of a fork pull request is reachable here as
      # refs/pull/<n>/head, so no fork remote is ever added.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The comparison base is the merge base, not the base branch tip: a
      # pull request must be judged against what it actually branched from,
      # otherwise unrelated master commits show up as ABI changes.
      - name: Resolve the comparison base
        id: resolve
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### ABI comparison base"
            echo ""
            echo "| | commit |"
            echo "| --- | --- |"
            echo "| pull request base | \`$PR_BASE_SHA\` |"
            echo "| pull request head | \`$PR_HEAD_SHA\` |"
            echo "| merge base (compared against) | \`$BASE_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A separate worktree, so the checkout keeps this pull request's ci/
      # scripts and ci/abi-assemblies.txt while the base sources are built.
      # The pull request declares the protected scope; the count assertion in
      # ci/abi-compat.sh and review are what police it.
      - name: Build the comparison base
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/abi-base-tree" "$BASE_SHA"
          dotnet build "$RUNNER_TEMP/abi-base-tree/Tesserafin.Server" -c Release -o ./abi-build

      - name: Stage the protected assemblies
        run: ./ci/abi-stage.sh ./abi-build ./abi-stage base

      - name: Upload base
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-base-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: abi-stage/

  abi-diff:
    name: ABI - Difference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - abi-controls
      - abi-head
      - abi-base
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Download head
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abi-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: abi-head

      - name: Download base
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abi-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: abi-base

      - name: Restore pinned tools
        run: dotnet tool restore

      # The verdict. ci/abi-compat.sh exits non-zero for a breaking change,
      # for a protected assembly missing on either side, for a manifest it
      # cannot fully validate, for an ApiCompat failure and for a run that
      # compared zero assemblies. Nothing downstream can turn that green.
      - name: Compare the protected assemblies
        env:
          ABI_REPORT_FILE: abi-report.md
          BASE_SHA: ${{ needs.abi-base.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Comparing head $HEAD_SHA against merge base $BASE_SHA"
          ./ci/abi-compat.sh ./abi-base ./abi-head

      # Always, including on a failing verdict — a report that only exists
      # when the gate is green is useless. The job summary and the artifact
      # below are the only copies; there is no pull request comment and
      # therefore no token, no write permission and no publication step whose
      # failure could hide or alter the verdict above.
      - name: Publish the report
        if: ${{ always() }}
        run: |
          if [ -f abi-report.md ]; then
            cat abi-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ABI comparison produced no report — see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: abi-report.md
          if-no-files-found: warn
          retention-days: 3
