name: Native recovery rehearsal

# Cold-snapshot recovery of the published linux-x64 .deb on a disposable hosted
# runner (#144). The package is the v1.1.0 release asset, pinned by SHA-256; nothing
# is built or published. The runner is destroyed afterwards, which is why the
# rehearsal may purge the package and delete /etc/tesserafin and /var/lib/tesserafin.
# The disk-loss pair hands the snapshot to a second runner that never held it.

on:
  pull_request:
    paths:
      - 'ci/native-recovery-deb.sh'
      - 'docker/recovery-state.py'
      - 'ci/recovery-evidence.py'
      - 'ci/tests/recovery-evidence.test.py'
      - '.github/workflows/native-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Published .deb cold-snapshot recovery (ubuntu-24.04, amd64)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_TAG: v1.1.0
      DEB_FILE: tesserafin-server_1.0.0-1_amd64.deb
      DEB_SHA256: a01121d984b9cfbbe4f3e494ac1c72f16084f2c43c8cc682f4d365c9fff44495
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Record source provenance and test the evidence boundary
        run: |
          set -euo pipefail
          umask 077
          export EVIDENCE_DIR="$RUNNER_TEMP/recovery-evidence"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/deb"
          python3 ci/tests/recovery-evidence.test.py
          python3 ci/recovery-evidence.py init --expected-source "$CANDIDATE_SHA" \
            --scope "native .deb cold-snapshot recovery; same host, same package, no forward migration" \
            --out "$EVIDENCE_DIR/source.json"
      - name: Download the published package and check its pinned digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$DEB_FILE" -D "$RUNNER_TEMP/deb"
          python3 ci/recovery-evidence.py package --deb "$RUNNER_TEMP/deb/$DEB_FILE" \
            --expected-sha256 "$DEB_SHA256" --out "$EVIDENCE_DIR/package.json"
      - name: Install, populate, cold backup, destroy, reinstall, restore and compare
        run: |
          set -euo pipefail
          status=0
          sudo TF_NATIVE_RECOVERY_DISPOSABLE=1 bash ci/native-recovery-deb.sh \
            "$RUNNER_TEMP/deb/$DEB_FILE" "$DEB_SHA256" > "$RUNNER_TEMP/recovery-raw.log" 2>&1 || status=$?
          python3 ci/recovery-evidence.py result --phase native-deb --raw "$RUNNER_TEMP/recovery-raw.log" \
            --exit-code "$status" --out "$EVIDENCE_DIR/result.json"
      - name: Retain allowlisted recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-recovery-deb-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove raw transient output
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/recovery-raw.log" "$RUNNER_TEMP/deb"

  # Disk-loss recovery: the snapshot leaves the source runner, and a second, fresh
  # runner that never held Tesserafin downloads the same pinned package itself and
  # restores it. The handoff artifact holds only the disposable fixture server's
  # archive, checksum, pre-backup listing and fixture tokens; it is kept for one day
  # at most and deleted once recovery ends.
  disk-loss-source:
    name: Published .deb disk-loss recovery - source host
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_TAG: v1.1.0
      DEB_FILE: tesserafin-server_1.0.0-1_amd64.deb
      DEB_SHA256: a01121d984b9cfbbe4f3e494ac1c72f16084f2c43c8cc682f4d365c9fff44495
    outputs:
      host: ${{ steps.host.outputs.host }}
      handoff-id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Record source provenance and host identity
        id: host
        run: |
          set -euo pipefail
          umask 077
          export EVIDENCE_DIR="$RUNNER_TEMP/recovery-evidence"
          export HANDOFF="$RUNNER_TEMP/recovery-handoff"
          printf 'EVIDENCE_DIR=%s\nHANDOFF=%s\n' "$EVIDENCE_DIR" "$HANDOFF" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR" "$HANDOFF" "$RUNNER_TEMP/deb"
          python3 ci/recovery-evidence.py init --expected-source "$CANDIDATE_SHA" \
            --scope "native .deb disk-loss recovery, source host; same package, no forward migration" \
            --out "$EVIDENCE_DIR/source.json"
          echo "host=$(sha256sum /proc/sys/kernel/random/boot_id | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Download the published package and check its pinned digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$DEB_FILE" -D "$RUNNER_TEMP/deb"
          python3 ci/recovery-evidence.py package --deb "$RUNNER_TEMP/deb/$DEB_FILE" \
            --expected-sha256 "$DEB_SHA256" --out "$EVIDENCE_DIR/package.json"
      - name: Install, populate, seed and take the cold snapshot
        run: |
          set -euo pipefail
          status=0
          sudo TF_NATIVE_RECOVERY_DISPOSABLE=1 TF_NATIVE_RECOVERY_PHASE=source TF_NATIVE_RECOVERY_HANDOFF="$HANDOFF" \
            bash ci/native-recovery-deb.sh "$RUNNER_TEMP/deb/$DEB_FILE" "$DEB_SHA256" \
            > "$RUNNER_TEMP/recovery-raw.log" 2>&1 || status=$?
          python3 ci/recovery-evidence.py result --phase native-deb-source --raw "$RUNNER_TEMP/recovery-raw.log" \
            --exit-code "$status" --out "$EVIDENCE_DIR/result.json"
          sudo chown -R "$(id -u):$(id -g)" "$HANDOFF"
      - name: Hand the snapshot off the source host
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-recovery-handoff-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/recovery-handoff/
          if-no-files-found: error
          retention-days: 1
      - name: Retain allowlisted source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-disk-loss-source-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove handoff and raw transient output
        if: always()
        run: sudo rm -rf -- "$HANDOFF" "$RUNNER_TEMP/recovery-raw.log" "$RUNNER_TEMP/deb"

  disk-loss-recover:
    name: Published .deb disk-loss recovery - fresh host
    needs: disk-loss-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # delete the handoff artifact once recovery ends
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_HOST: ${{ needs.disk-loss-source.outputs.host }}
      RELEASE_TAG: v1.1.0
      DEB_FILE: tesserafin-server_1.0.0-1_amd64.deb
      DEB_SHA256: a01121d984b9cfbbe4f3e494ac1c72f16084f2c43c8cc682f4d365c9fff44495
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Record provenance and prove this is a different host
        run: |
          set -euo pipefail
          umask 077
          export EVIDENCE_DIR="$RUNNER_TEMP/recovery-evidence"
          export HANDOFF="$RUNNER_TEMP/recovery-handoff"
          printf 'EVIDENCE_DIR=%s\nHANDOFF=%s\n' "$EVIDENCE_DIR" "$HANDOFF" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR" "$HANDOFF" "$RUNNER_TEMP/deb"
          python3 ci/recovery-evidence.py init --expected-source "$CANDIDATE_SHA" \
            --scope "native .deb disk-loss recovery, fresh host; same package, no forward migration" \
            --out "$EVIDENCE_DIR/source.json"
          host="$(sha256sum /proc/sys/kernel/random/boot_id | cut -d' ' -f1)"
          [[ "$SOURCE_HOST" =~ ^[0-9a-f]{64}$ && "$host" != "$SOURCE_HOST" ]]
          printf '{"recovery_host_boot_id_sha256": "%s", "schema": 1, "source_host_boot_id_sha256": "%s"}\n' \
            "$host" "$SOURCE_HOST" > "$EVIDENCE_DIR/hosts.json"
      - name: Download the published package independently and check its pinned digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$DEB_FILE" -D "$RUNNER_TEMP/deb"
          python3 ci/recovery-evidence.py package --deb "$RUNNER_TEMP/deb/$DEB_FILE" \
            --expected-sha256 "$DEB_SHA256" --out "$EVIDENCE_DIR/package.json"
      - name: Fetch the off-host snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-recovery-handoff-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/recovery-handoff
      - name: Verify the snapshot, install the same package, restore and compare
        run: |
          set -euo pipefail
          status=0
          sudo TF_NATIVE_RECOVERY_DISPOSABLE=1 TF_NATIVE_RECOVERY_PHASE=recover TF_NATIVE_RECOVERY_HANDOFF="$HANDOFF" \
            bash ci/native-recovery-deb.sh "$RUNNER_TEMP/deb/$DEB_FILE" "$DEB_SHA256" \
            > "$RUNNER_TEMP/recovery-raw.log" 2>&1 || status=$?
          python3 ci/recovery-evidence.py result --phase native-deb-recover --raw "$RUNNER_TEMP/recovery-raw.log" \
            --exit-code "$status" --out "$EVIDENCE_DIR/result.json"
      - name: Retain allowlisted recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-disk-loss-recover-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Delete the handoff artifact and local copies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ID: ${{ needs.disk-loss-source.outputs.handoff-id }}
        run: |
          sudo rm -rf -- "$HANDOFF" "$RUNNER_TEMP/recovery-raw.log" "$RUNNER_TEMP/deb"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$HANDOFF_ID"
