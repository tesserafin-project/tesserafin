# ARMED on 2026-07-30 (#94, slice #156). Both reasons this workflow was held
# back are gone.
#
# 1. Allocation. Fixed since 2026-07-27 — run 30229812748 executed 8 steps on
#    a real hosted runner, the exact opposite of the parked signature (failure
#    in 3-4 s, zero steps, no runner).
#
# 2. Format debt. Run 30230606255 reported 75 StyleCop XML-documentation
#    diagnostics (47 SA1615, 26 SA1611, 1 SA1629, 1 SA1618) across 16 test
#    files — pre-existing debt accumulated while hosted CI was down, which
#    would have made every pull request permanently red. It is cleared by
#    writing the missing documentation in this same change. No rule was
#    suppressed, disabled or downgraded to get there, and the gate was proven
#    to still be active by deleting one `<param>` line and watching
#    `dotnet format` fail with SA1611 again.
#    (The parking narrative said "22 files". That figure was wrong at the
#    source: re-reading run 30230606255's own log yields 16.)
#
# NOT restored by this: required status checks. GET
# .../branches/master/protection and GET .../rulesets both return 403
# "Upgrade to GitHub Pro or make this repository public to enable this
# feature" (private repository, free organisation plan). This workflow
# reports a status automatically; nothing can make that status mandatory.
# #94 stays open for that reason, and ./ci/run.sh remains the authoritative
# merge gate.
#
# No path filter and no draft-pull-request skip, deliberately. Format is
# cheap (one restore, one analyzer pass, no test execution), and any file
# this gate can read is a file it must be allowed to fail on — a documentation
# exclusion here would let the very debt above accumulate again unseen.

name: Format

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  format-check:
    runs-on: ubuntu-latest

    # Minute economy: a hard ceiling. Without it a hung run bills up to the
    # 6-hour default. The same command finishes locally in ~1 min.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Run DotNet Format
        run: dotnet format --verify-no-changes --verbosity minimal
