# PARKED — manual trigger only (issue #62). Same allocation refusal as the
# other hosted workflows (account-wide free Actions allowance exhausted,
# spending limit $0): red on every pull request before the first step.
# Nothing is fixed here — the trigger is disarmed to stop the noise.
# See docs/local-ci.md.
#
# Format/style is not left entirely unguarded: the build runs with
# warnings-as-errors via Directory.Build.props, and the local gate
# (./ci/run.sh) fails on those. It is a weaker check than `dotnet format`
# and that gap is accepted, not hidden, for the duration of the outage.
#
# Previous trigger: on: push (master) + pull_request
name: Format
on:
  workflow_dispatch:

env:
  SDK_VERSION: "10.0.x"

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Run DotNet Format
        run: dotnet format --verify-no-changes --verbosity minimal
