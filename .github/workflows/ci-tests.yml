# ARMED on 2026-07-27 (#94). Both blockers are gone.
#
# 1. Allocation. Run 30229812748 — job "ABI - HEAD" completed/SUCCESS with 8
#    executed steps on runner "GitHub Actions 1000000000" — the exact opposite
#    of the parked signature (failure in 3-4 s, zero steps, no runner).
#
# 2. Native dependencies. Run 30230606313 failed 2 MediaEncoding and 12
#    PlaybackUrlContract end-to-end tests on a bare runner. Installing ffmpeg
#    and libfontconfig1 — the same packages Dockerfile.ci installs — plus
#    filtering Category!=Smoke to match ./ci/run.sh exactly cleared 13 of
#    those 14 (run 30231076754).
#
# 3. The last one, OpenApiContractTests.CommittedContract_MatchesRunningServer,
#    was a real reproducibility defect in the server and is fixed in this same
#    commit: the XML documentation files were fed to Swashbuckle in
#    filesystem order, so the generated contract differed between machines.
#    Local and hosted now agree byte for byte on
#    sha256 ab2fa4fbb2d420e75205837c4fd7be2d80799149fa4e34c33e94713c78746744.
#
# 4. Since [C1.1] (#151) that ordering is also guarded repository-locally by
#    OpenApiXmlDocumentationOrderTests, which drives the canonical order with
#    explicit permutations and fails on ANY machine if it is weakened — the
#    hosted job is no longer the only thing standing between the contract and
#    a silent cross-machine divergence. On failure this job now retains both
#    documents as a short-retention artifact.
#
# This job is the CROSS-MACHINE half of the contract guard.
# OpenApiContractTests.Contract_IsByteIdentical_AcrossColdGenerations only
# reboots the application on one filesystem, where the enumeration order is
# stable; it cannot catch an order that differs between hosts. Running the
# same test on a hosted runner can, and that is what caught this one.
#
# NOT restored by this: required status checks. GET .../branches/master/protection
# and GET .../rulesets both return 403 "Upgrade to GitHub Pro or make this
# repository public to enable this feature" (private repository, free
# organisation plan). This workflow reports a status automatically; nothing can
# make that status mandatory. #94 stays open for that reason, and ./ci/run.sh
# remains the authoritative merge gate.
#
# ── Parking stamp (historical, 2026-07-19 allocation outage) ───────────────
# PARKED — manual trigger only (issue #62). GitHub refuses to allocate a
# hosted runner for this PRIVATE repo BEFORE the first step (account-wide
# 2000 free minutes/month exhausted, spending limit $0), so this went red on
# every pull request and every push to master without running a single step.
# Nothing is fixed here — the trigger is disarmed to stop the noise.
#
# The test suite is NOT unguarded meanwhile: the mandatory merge gate during
# the outage is the local Docker CI (./ci/run.sh, which purges bin/ + obj/
# itself before compiling anything — see #94),
# which runs the same `dotnet build` + `dotnet test` over Tesserafin.sln.
# See docs/local-ci.md.
#
# Previous trigger: on: push (master) + pull_request
# (Original note kept for the restore: PRs run against the forked branch
# without access to secrets —
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflows-in-forked-repositories)
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [master]
    # Minute economy: a documentation-only change cannot break the build or
    # the test suite. This is safe HERE because this workflow contains no
    # security analysis — CodeQL must never carry a documentation exclusion.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    # NO paths-ignore, deliberately. `Tests` is about to become a REQUIRED status
    # check on the protected `master`. A path-filtered `pull_request` trigger does
    # not start the workflow at all, so no check run is ever created, so a required
    # check sits at "Expected — waiting for status to be reported" forever and the
    # pull request can never merge. A documentation-only pull request would be
    # permanently unmergeable. The extra minutes are the deliberate price of a
    # required check that can actually report.
    #
    # The `push` trigger above keeps its exclusion: nothing gates on it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  run-tests:
    # Minute economy: draft pull requests do not spend runner time. Marking a
    # pull request ready for review triggers a fresh run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    # Minute economy: a hard ceiling. Without it a hung test run bills up to
    # the 6-hour default. The local gate finishes the same work in ~5 min.
    timeout-minutes: 30

    strategy:
      # See the OS matrix note in the restoration stamp: automatic runs are
      # ubuntu-latest only, because macOS (x10) and Windows (x2) minute
      # multipliers are what exhausted the free allowance in July 2026. The
      # full matrix stays reachable by hand through workflow_dispatch.
      matrix:
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
      # Minute economy: stop the remaining OS legs as soon as one fails.
      # Nothing here needs the full failure matrix to be actionable.
      fail-fast: true

    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      # Minute economy: NuGet restore is the single most repetitive cost in
      # this job. The local gate caches it in a named Docker volume; this is
      # the hosted equivalent.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Same native dependencies Dockerfile.ci installs for the local gate.
      # Without ffmpeg the MediaEncoding and PlaybackUrlContract end-to-end
      # tests fail on a bare hosted runner even though the tree is sound —
      # proven by run 30230606313, which failed 2 MediaEncoding and 12
      # Integration tests for exactly that reason. libfontconfig1 is what
      # SkiaSharp.NativeAssets.Linux needs. This is what makes the hosted job
      # equivalent to ./ci/run.sh rather than a weaker approximation of it.
      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libfontconfig1

      - name: Run DotNet CLI Tests
        # --filter matches ci/run.sh exactly: Category=Smoke is the optional,
        # explicitly non-blocking stage (PR115d), invoked by ./ci/smoke.sh.
        # Minute economy: coverage instrumentation and the ReportGenerator step
        # below run on master pushes only. On a pull request the question is
        # "does it build and pass", and coverage roughly doubles the test
        # stage for an answer nobody reads on the pull request itself.
        run: >
          dotnet test Tesserafin.sln
          --configuration Release
          --filter 'Category!=Smoke'
          ${{ github.event_name == 'push' && '--collect:"XPlat Code Coverage" --settings tests/coverletArgs.runsettings' || '' }}
          --verbosity minimal

      # Diagnosis, not enforcement. The OpenAPI equality assertion is unchanged and still
      # fails the job; this only stops a cross-machine divergence from being unreproducible.
      # A run that disagrees used to print two hashes and discard both documents, and the
      # machine that reports the difference is by definition not the machine you can
      # reproduce it on. The test writes the pair only on mismatch, so on a green run there
      # is nothing to upload and this step no-ops. Contents are the two canonical contracts
      # and their hashes — no secrets, no environment, no absolute paths.
      - name: Retain OpenAPI drift evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-drift-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/openapi-drift/
          if-no-files-found: ignore
          retention-days: 3

      - name: Merge code coverage results
        if: ${{ github.event_name == 'push' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # v5.5.10
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      # TODO - which action / tool to use to publish code coverage results?
      # - name: Publish code coverage results
