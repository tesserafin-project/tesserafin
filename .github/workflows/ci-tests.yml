#
# This job is the CROSS-MACHINE half of the contract guard.
# OpenApiContractTests.Contract_IsByteIdentical_AcrossColdGenerations only
# reboots the application on one filesystem, where the enumeration order is
# stable; it cannot catch an order that differs between hosts. Running the
