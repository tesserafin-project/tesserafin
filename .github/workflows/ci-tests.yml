name: Tests

on:
  push:
    branches: [master]
    # Minute economy: a documentation-only change cannot break the build or
    # the test suite. This is safe HERE because this workflow contains no
    # security analysis — CodeQL must never carry a documentation exclusion.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    # NO paths-ignore, deliberately. `Tests` is about to become a REQUIRED status
    # check on the protected `master`. A path-filtered `pull_request` trigger does
    # not start the workflow at all, so no check run is ever created, so a required
    # check sits at "Expected — waiting for status to be reported" forever and the
    # pull request can never merge. A documentation-only pull request would be
    # permanently unmergeable. The extra minutes are the deliberate price of a
    # required check that can actually report.
    #
    # The `push` trigger above keeps its exclusion: nothing gates on it.
    #
    # `ready_for_review` is REQUIRED here for the same "a required check must be
    # able to report" reason. `run-tests` is draft-gated below, and without this
    # type the default set (opened, synchronize, reopened) means marking a draft
    # ready fires no run at all: the draft-time "skipping" result stays the last
    # one recorded, a skipped required check never satisfies protection, and the
    # pull request is unmergeable until somebody pushes an unrelated commit.
    # Observed on #227.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  test-suites:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    strategy:
      # Preserve the automatic Linux gate and the manually requested OS matrix.
      matrix:
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
        suite:
          # Complementary filters retain every non-Smoke test. Keep the full
          # solution build in the unit leg, including projects without tests.
          - name: unit
            target: Tesserafin.sln
            filter: 'Category!=Smoke&FullyQualifiedName!~Tesserafin.Server.Integration.Tests.'
          - name: integration
            target: tests/Tesserafin.Server.Integration.Tests/Tesserafin.Server.Integration.Tests.csproj
            filter: 'Category!=Smoke&FullyQualifiedName!~Tesserafin.Server.Integration.Tests.EndToEnd.'
          - name: end-to-end
            target: tests/Tesserafin.Server.Integration.Tests/Tesserafin.Server.Integration.Tests.csproj
            filter: 'Category!=Smoke&FullyQualifiedName~Tesserafin.Server.Integration.Tests.EndToEnd.'
      # A red suite must not cancel the others: each one's own verdict and TRX
      # report stay available, and run-tests below still rejects any failure.
      fail-fast: false
    name: Tests - ${{ matrix.suite.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TEST_TARGET: ${{ matrix.suite.target }}
      TEST_FILTER: ${{ matrix.suite.filter }}
      TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results/${{ matrix.suite.name }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The Azure Ubuntu mirror answers `apt-get update` in seconds but can stall
      # on individual .deb downloads for minutes each (run 40576004694: 84 of 87
      # packages in five minutes). Keep the downloaded archives between runs so a
      # normal run fetches nothing. Key on the runner image: a new image restores
      # the previous archives and apt downloads only the versions that changed.
      - name: Native package cache key
        id: native-key
        if: runner.os == 'Linux'
        run: |
          echo "prefix=native-debs-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=native-debs-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache native test packages
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/native-test-debs
          key: ${{ steps.native-key.outputs.key }}
          restore-keys: ${{ steps.native-key.outputs.prefix }}

      # All three suites include native tests. Preserve ffmpeg/fontconfig;
      # bound slow mirrors rather than letting apt consume the job budget.
      # Packages are still resolved against fresh lists: the cache only spares
      # downloads, it never pins versions.
      - name: Install native test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          debs="$HOME/.cache/native-test-debs"
          sudo mkdir -p "$debs/partial"
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o "Dir::Cache::archives=$debs")
          echo "Cached archives: $(find "$debs" -maxdepth 1 -name '*.deb' | wc -l)"
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg libfontconfig1
          # Drop archives no longer downloadable, and leave a tree the cache
          # action (running unprivileged) can archive.
          sudo apt-get "${apt_opts[@]}" autoclean
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"

      # Separate timings show whether restore, compilation or tests regressed.
      # Build outputs remain local to this exact checkout; only NuGet is cached.
      - name: Restore
        run: dotnet restore "$TEST_TARGET" --verbosity minimal

      - name: Build
        run: dotnet build "$TEST_TARGET" --configuration Release --no-restore --verbosity minimal

      - name: Run DotNet CLI Tests
        id: tests
        # Match ci/run.sh's optional Smoke exclusion. Keep coverage on master
        # pushes and merge all three suites below; PRs remain uninstrumented.
        run: >-
          dotnet test "$TEST_TARGET"
          --configuration Release --no-build
          --filter "$TEST_FILTER"
          ${{ github.event_name == 'push' && '--collect:"XPlat Code Coverage" --settings tests/coverletArgs.runsettings' || '' }}
          --logger trx
          --results-directory "$TEST_RESULTS"
          --verbosity minimal

      - name: Summarize test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python ci/summarize-test-results.py "$TEST_RESULTS"

      - name: Retain test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.suite.name }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 3

      # The assertion still fails the suite. Retain only the canonical contracts
      # and their hashes, as before, when diagnosing cross-machine drift.
      - name: Retain OpenAPI drift evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-drift-${{ matrix.suite.name }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/openapi-drift/
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain suite coverage
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.suite.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 3

  coverage:
    if: ${{ github.event_name == 'push' }}
    needs: test-suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/

      - name: Merge code coverage results
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # v5.5.10
        with:
          reports: "coverage/**/coverage.cobertura.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      - name: Retain merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: merged/Cobertura.xml
          if-no-files-found: error
          retention-days: 3

  # Keep the existing required check names. An ordinary `needs` job is skipped
  # on failure, which GitHub can accept as a passing required check. Always run
  # the verdict and explicitly reject failures, cancellation and skipped suites.
  run-tests:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [test-suites, coverage]
    strategy:
      matrix:
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Verify all test suites and coverage
        shell: bash
        env:
          SUITES_RESULT: ${{ needs.test-suites.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          EXPECTED_COVERAGE: ${{ github.event_name == 'push' && 'success' || 'skipped' }}
        run: |
          test "$SUITES_RESULT" = success
          test "$COVERAGE_RESULT" = "$EXPECTED_COVERAGE"
