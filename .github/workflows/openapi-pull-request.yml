# PARKED — manual trigger only (issue #62). Same cause as ci-compat.yml:
# GitHub refuses to allocate a hosted runner for this PRIVATE repo BEFORE the
# first step (account-wide free allowance exhausted, spending limit $0), so
# "Common Ancestor" / "Head Artifact" / "Base Artifact" failed in 3-4 s with
# zero steps executed. Nothing is fixed here — the trigger is disarmed so this
# stops reddening every pull request. See docs/local-ci.md.
#
# The OpenAPI contract is NOT unguarded meanwhile: OpenApiContractTests runs
# inside the mandatory local gate (./ci/run.sh) and fails it on drift.
# See docs/openapi-contract.md.
#
# NOTE: the jobs below read github.event.pull_request.*, so a manual
# workflow_dispatch run cannot produce a meaningful diff report. The real
# re-enable is restoring `pull_request:`.
#
# Previous trigger: on: pull_request
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: OpenAPI Check
on:
  workflow_dispatch:

jobs:
  ancestor:
    name: Common Ancestor
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.ancestor.outputs.base_ref }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        fetch-depth: 0
    - name: Search History
      id: ancestor
      run: |
        git remote add upstream https://github.com/${{ github.event.pull_request.base.repo.full_name }}
        git fetch --prune --progress --no-recurse-submodules upstream +refs/heads/*:refs/remotes/upstream/* +refs/tags/*:refs/tags/*

        ANCESTOR_REF=$(git merge-base upstream/${{ github.base_ref }} HEAD)

        echo "ref: ${ANCESTOR_REF}"

        echo "base_ref=${ANCESTOR_REF}" >> "$GITHUB_OUTPUT"

  head:
    name: Head Artifact
    uses: ./.github/workflows/openapi-generate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      artifact: openapi-head

  base:
    name: Base Artifact
    uses: ./.github/workflows/openapi-generate.yml
    needs:
    - ancestor
    with:
      ref: ${{ needs.ancestor.outputs.base_ref }}
      repository: ${{ github.event.pull_request.base.repo.full_name }}
      artifact: openapi-base

  diff:
    name: Generate Report
    runs-on: ubuntu-latest
    needs:
    - head
    - base
    steps:
    - name: Download Head
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: openapi-head
        path: openapi-head
    - name: Download Base
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: openapi-base
        path: openapi-base
    - name: Detect Changes
      id: openapi-diff
      run: |
        # Les deux artefacts sont désormais le contrat canonique commité
        # (openapi/openapi.json) de chaque côté, produit par le générateur unique
        # ./ci/openapi-generate.sh — issue #48.
        #
        # La réécriture `sed -i 's:allOf:oneOf:g'` appliquée aux deux entrées a été
        # retirée. C'était un contournement symétrique, indépendant du problème
        # brut/canonique (`allOf` vient du modèle de types C# et traverse la
        # canonicalisation inchangé) : il modifiait la composition de schémas que
        # openapi-diff analyse. On lui donne désormais le document réel.
        mkdir -p /tmp/openapi-report
        mv openapi-head/openapi.json /tmp/openapi-report/head.json
        mv openapi-base/openapi.json /tmp/openapi-report/base.json

        docker run -v /tmp/openapi-report:/data openapitools/openapi-diff:2.1.6 /data/base.json /data/head.json --state -l ERROR --markdown /data/openapi-report.md
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: openapi-report
        path: /tmp/openapi-report/openapi-report.md
