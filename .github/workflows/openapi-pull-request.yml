# ARMED on 2026-07-30 (#162). Automatic again on every pull request.
#
# WHY IT WAS PARKED, AND WHAT CHANGED. The trigger was reduced to
# `workflow_dispatch` because `openapitools/openapi-diff:2.1.6` cannot process
# this contract at all. Run 30230606338 (event `pull_request`, PR #132) had
# "Common Ancestor", "Head Artifact" and "Base Artifact" all SUCCESS, then
# "Generate Report" died in its "Detect Changes" step:
#
#   docker run -v /tmp/openapi-report:/data openapitools/openapi-diff:2.1.6 \
#       /data/base.json /data/head.json --state -l ERROR --markdown ...
#   Exception in thread "main" java.lang.StackOverflowError
#   ##[error]Process completed with exit code 1.
#
# That was a defect in the diff tool, not a detected incompatibility, and it
# would have gone red on every pull request. 2.1.7 — the current release —
# still overflows on the same document, verified on 2026-07-30. The engine is
# now oasdiff, pinned by version and immutable digest in ci/openapi-compat.sh,
# which processes the full 2 MB contract in about two seconds.
#
# WHAT THIS CHECK IS FOR. It is NOT the drift check. `Tests` already runs
# OpenApiContractTests.CommittedContract_MatchesRunningServer, which proves the
# committed openapi/openapi.json is byte-for-byte what the HEAD server
# generates. This workflow answers a different question: comparing the MERGE
# BASE contract with the PULL-REQUEST HEAD contract, does the API surface move
# in a way that breaks existing clients? It never regenerates or rewrites
# either document — ci/openapi-generate.sh owns that.
#
# FAIL-CLOSED. Breaking changes are red. So is every "we do not know": missing
# or malformed contract, missing or invalid lock file, lock SHA-256 mismatch,
# engine crash, engine timeout, unparsable engine output, missing report. The
# "Controls" job proves each of those paths on every run, including against the
# real contract, so a green "Semantic Diff" is a claim the same run has already
# tested.
#
# NOT restored by this: required status checks. GET .../branches/master/protection
# and GET .../rulesets both return 403 on a private repository under a free
# organisation plan. This workflow reports a status automatically; nothing can
# make that status mandatory. #94 stays open for that reason.
#
# The bot-comment companion (openapi-workflow-run.yml) is deleted, not parked:
# it existed only to repost the report using `secrets.JF_BOT_TOKEN`, a Jellyfin
# bot credential this organisation does not have. The report now lives in the
# job summary and in a short-retention artifact, which needs no secret at all.

name: OpenAPI Check

on:
  pull_request:
    branches:
      - master
    # `ready_for_review` is REQUIRED here, not decorative. The jobs below are
    # draft-gated with `if: github.event.pull_request.draft == false`, and they
    # are REQUIRED status checks on master. Without this type the default set
    # (opened, synchronize, reopened) means marking a draft ready fires no run
    # at all: the draft-time "skipping" result is the last one recorded, a
    # skipped required check never satisfies protection, and the pull request
    # is unmergeable until somebody pushes an unrelated commit. Observed on
    # #227.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    # Named with the workflow's prefix, like every ABI job in ci-compat.yml.
    # `Controls` alone collided byte-for-byte with secret-scan.yml's controls
    # job, and branch protection matches a required status check by context
    # NAME. Two jobs sharing one name make the required-check list ambiguous
    # and the protection readback unverifiable.
    name: OpenAPI - Controls
    # Minute economy, matching ci-tests.yml: draft pull requests do not spend
    # runner time. Marking one ready for review triggers a fresh run.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the corrective-ledger controls below resolve the two
      # contract digests the transition names back to the commits that carry
      # them, by walking the history of openapi/openapi.json. A shallow clone
      # cannot answer that and would fail the job for the wrong reason.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Thirty-odd assertions, roughly forty seconds. They run the real
      # committed contract through the engine — identical, with an endpoint
      # removed, with an optional property added — plus every indeterminate
      # path. This is what makes the verdict of the next job worth reading.
      - name: Run the compatibility gate controls
        run: ./ci/tests/openapi-compat.test.sh

      # The corrective-transition ledger (#226) can turn a BREAKING verdict into
      # a pass. A mechanism that can do that has to be observed REFUSING, here,
      # on the same runner that judges the pull request — otherwise the only
      # evidence it is narrow is that someone said so. Forty-one assertions:
      # a sixth finding, a removed finding, every identity field mismatched in
      # turn, either digest moved, wildcards and pattern keys rejected, a
      # consumer exiting 126/127 treated as indeterminate rather than as a pass,
      # and the corrected contract compared with itself passing WITHOUT the
      # ledger ever being invoked.
      #
      # RUN_GATE_CONTROLS=1 additionally runs the end-to-end half through
      # ci/openapi-compat.sh and the real engine; docker is already required by
      # the suite above, so this adds no new dependency.
      - name: Run the corrective-transition ledger controls
        env:
          RUN_GATE_CONTROLS: '1'
        run: ./ci/tests/openapi-corrective-ledger.test.sh

  compare:
    name: Semantic Diff
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the merge base is computed here, not taken from the event
      # payload. `github.event.pull_request.base.sha` is the base tip as of the
      # last synchronisation and drifts away from the real common ancestor.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve the merge base
        id: refs
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fetching the pull-request head ref by number works identically for
          # a branch in this repository and for a fork, and needs nothing
          # beyond the read-only GITHUB_TOKEN.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/pr-base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"

          RESOLVED_HEAD="$(git rev-parse refs/remotes/pr-head)"
          if [ "$RESOLVED_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::refs/pull/${PR_NUMBER}/head is ${RESOLVED_HEAD}, the event says ${HEAD_SHA}"
            exit 1
          fi

          MERGE_BASE="$(git merge-base refs/remotes/pr-base "$HEAD_SHA")"

          echo "pull request  : #${PR_NUMBER}"
          echo "event         : ${GITHUB_EVENT_NAME}"
          echo "base branch   : ${BASE_REF} -> $(git rev-parse refs/remotes/pr-base)"
          echo "head sha      : ${HEAD_SHA}"
          echo "merge base    : ${MERGE_BASE}"

          {
            echo "head_sha=${HEAD_SHA}"
            echo "merge_base=${MERGE_BASE}"
          } >> "$GITHUB_OUTPUT"

      # Read both contract/lock pairs straight out of git. No regeneration, no
      # canonicalisation, no artifact choreography between jobs — the committed
      # bytes at each commit are exactly what gets compared.
      - name: Extract the base and head contracts
        env:
          MERGE_BASE: ${{ steps.refs.outputs.merge_base }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p contracts

          for side in base head; do
            case "$side" in
              base) rev="$MERGE_BASE" ;;
              head) rev="$HEAD_SHA" ;;
            esac
            for file in openapi.json contract.lock.json; do
              if ! git show "${rev}:openapi/${file}" > "contracts/${side}-${file}"; then
                echo "::error::openapi/${file} is missing at ${rev}"
                exit 1
              fi
            done
          done

          sha256sum contracts/*

      - name: Compare the merge base with the pull-request head
        run: |
          ./ci/openapi-compat.sh \
            --base      contracts/base-openapi.json \
            --base-lock contracts/base-contract.lock.json \
            --head      contracts/head-openapi.json \
            --head-lock contracts/head-contract.lock.json \
            --report    report/openapi-compat.md \
            --json      report/openapi-findings.json

      # Published whatever the verdict: a breaking or indeterminate result is
      # exactly when a reviewer needs the report.
      - name: Publish the report to the job summary
        if: ${{ always() }}
        env:
          MERGE_BASE: ${{ steps.refs.outputs.merge_base }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Compared commits"
            echo
            echo "| Side | Commit |"
            echo "| --- | --- |"
            echo "| Merge base | \`${MERGE_BASE:-unresolved}\` |"
            echo "| Head | \`${HEAD_SHA:-unresolved}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s report/openapi-compat.md ]; then
            cat report/openapi-compat.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced. Treat this run as indeterminate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-compat-${{ github.run_id }}
          path: |
            report/
            contracts/
          retention-days: 7
          if-no-files-found: warn
