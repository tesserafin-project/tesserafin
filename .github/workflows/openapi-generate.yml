name: OpenAPI Generate

# Publie le contrat canonique COMMITÉ, `openapi/openapi.json`.
#
# Ce workflow ne génère plus rien. Le générateur autoritaire unique est
# `./ci/openapi-generate.sh` (Docker, local), qui exécute
# `OpenApiContractTests.CommittedContract_MatchesRunningServer` avec
# `TESSERAFIN_OPENAPI_WRITE=1` et écrit la forme canonique. `./ci/run.sh` rejoue le
# même test en mode vérification : le fichier commité ne peut donc pas dériver
# de ce que le serveur produit. Voir docs/openapi-contract.md.
#
# Avant, cette étape lançait un second générateur (`--filter OpenApiSpecTests`)
# et téléversait `tests/.../bin/Release/net10.0/openapi.json` : un artefact brut,
# dépendant de l'hôte (`servers` réécrit depuis l'en-tête `Host`, ordre des clés
# non déterministe), donc un contrat DIFFÉRENT du contrat canonique — issue #48.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}

    # Un seul fichier téléversé : il arrive côté consommateur à la racine de
    # l'artefact, sous son nom de base `openapi.json` — exactement là où
    # openapi-pull-request.yml et openapi-merge.yml le lisent déjà.
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact }}
        path: openapi/openapi.json
        retention-days: 14
        if-no-files-found: error
