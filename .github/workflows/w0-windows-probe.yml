# W0 native Windows probe (#234).
#
# THIS IS NOT A DISTRIBUTION WORKFLOW. It builds no Tesserafin Windows package,
# publishes nothing, signs nothing, pushes to no registry and creates no release.
# Everything it produces is short-retention probe evidence for the W0 architecture
# document, and W0 evidence is never a production input.
#
# It is deliberately NOT wired into master's required status checks. It exists to
# answer, on a real native Windows x64 host, the questions docs/distribution/
# W0-windows-server.md has to answer from measurement rather than from preference.
#
# The Windows leg of the existing `Tests` workflow cannot supply the server test
# verdict on its own: that matrix runs with fail-fast, macOS currently fails
# OpenApiXmlDocumentationOrderTests on master, and the Windows leg is cancelled
# before it finishes. `windows-tests` below runs the identical command so the
# verdict exists; it is reported as W0 evidence, not as a `Tests` result.

name: W0 Windows Probe

on:
  # There is deliberately NO `push` trigger.
  #
  # `push` on `w0/**` and `pull_request` against `master` both fire for the SAME
  # commit while the branch has an open PR, on two different refs. The
  # concurrency group below then cancels one of them -- and a cancelled job is
  # not acceptance evidence. Deduplicating was not enough: the duplicate is
  # removed, leaving one attributable trigger per commit. `workflow_dispatch`
  # covers running this on master after the merge, where no pull request exists.
  pull_request:
    branches: [master]
    paths:
      - 'ci/windows/w0/**'
      - '.github/workflows/w0-windows-probe.yml'
      - 'docs/distribution/W0-windows-server.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"
  # Must equal ffmpeg.commit in ci/ffmpeg/components.json and F0_UPSTREAM_COMMIT
  # in ci/package/pins.env. Asserted by the spike, not assumed.
  FFMPEG_COMMIT: d4590e12452f94d40e413caecb34b08de608353b

  # THE canonical evidence SHA. Defined once; every job checks this exact commit
  # out and every evidence document records it.
  #
  # On `pull_request`, actions/checkout defaults to GitHub's SYNTHETIC MERGE REF
  # (`refs/pull/N/merge`) -- a commit that exists in no branch and changes
  # whenever master moves. Evidence measured there is not attributable to the
  # immutable PR head that a reviewer accepts and that actually gets merged. An
  # earlier run of this workflow did exactly that: it checked out
  # `18a36c2c... "Merge 21abb7e1... into f7479d5..."` and stamped that merge
  # commit into every evidence file as the head SHA.
  #
  # Pinning the head SHA is only half of it -- a job could still be handed a
  # tree that is not that commit. Each job therefore ASSERTS its checked-out
  # HEAD equals this value before measuring anything (`Assert the evidence SHA`).
  W0_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # ── The Web payload boundary ────────────────────────────────────────────────
  #
  # ci/package/assemble-payload.sh obtains the bundled Tesserafin Web payload by
  # `docker create` + `docker cp` from a LINUX OCI image. A windows-latest runner
  # cannot run Linux containers, so the Linux packaging path is not reusable as
  # written. This job proves the payload can still be delivered to Windows WITHOUT
  # weakening provenance: it is extracted here, verified against the same
  # WEB_PAYLOAD_SHA256 the Linux packages verify, and handed over by digest.
  #
  # In production (W2) the equivalent step is a daemonless digest-pinned OCI pull
  # on the Windows host itself. Using an Actions artifact HERE is acceptable only
  # because this is probe evidence; #234 forbids an expiring artifact from ever
  # becoming a production input.
  web-payload:
    name: Web payload (digest-verified)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read-only, and only so the pinned tesserafin-web-assets image can be
      # pulled by digest — the same grant and the same reason as the
      # `linux-packages` build job. Nothing here writes to any registry.
      packages: read
    outputs:
      digest: ${{ steps.extract.outputs.digest }}
      expected: ${{ steps.extract.outputs.expected }}
      matches: ${{ steps.extract.outputs.matches }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      # Attribution guard. A pinned `ref:` says which commit was REQUESTED; this
      # says which commit is actually here. Without it a checkout that silently
      # resolved to something else -- a merge ref, a moved branch -- would still
      # produce confident-looking evidence.
      - name: Assert the evidence SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected : ${W0_EVIDENCE_SHA}"
          echo "actual   : ${actual}"
          if [ "${actual}" != "${W0_EVIDENCE_SHA}" ]; then
            echo "W0 HARD STOP: this job is standing in ${actual}, not the evidence SHA ${W0_EVIDENCE_SHA}." >&2
            exit 1
          fi

      - name: Authenticate to GHCR for the pinned web assets image
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: Extract and verify the pinned Web payload
        id: extract
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source ci/package/lib.sh
          pkg_load_pins

          echo "web assets image : ${WEB_ASSETS_IMAGE}"
          echo "web commit       : ${WEB_VCS_REF}"

          work="$(mktemp -d)"
          docker pull --quiet "${WEB_ASSETS_IMAGE}" >/dev/null
          cid="$(docker create "${WEB_ASSETS_IMAGE}" /bin/true)"
          mkdir -p "${work}/web" "${work}/licenses"
          docker cp "${cid}:/web/."       "${work}/web/"      >/dev/null
          docker cp "${cid}:/licenses/."  "${work}/licenses/" >/dev/null
          docker cp "${cid}:/metadata/web-revision.json" "${work}/web-revision.json" >/dev/null
          docker rm -f "${cid}" >/dev/null

          revision="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["revision"])' "${work}/web-revision.json")"
          epoch="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sourceDateEpoch"])' "${work}/web-revision.json")"
          [[ "${revision}" == "${WEB_VCS_REF}" ]] || {
            echo "web provenance mismatch: payload says '${revision}', pin says '${WEB_VCS_REF}'" >&2
            exit 1
          }

          find "${work}/web" -type d -exec chmod 0755 {} +
          find "${work}/web" -type f -exec chmod 0644 {} +
          digest="$(pkg_tree_digest "${work}/web" "${epoch}")"

          echo "digest=${digest}"       >> "$GITHUB_OUTPUT"
          echo "expected=${WEB_PAYLOAD_SHA256}" >> "$GITHUB_OUTPUT"
          if [[ "${digest}" == "${WEB_PAYLOAD_SHA256}" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "W0 HARD STOP: Web payload digest ${digest} != pinned ${WEB_PAYLOAD_SHA256}" >&2
            exit 1
          fi

          mkdir -p artifacts/w0-web
          cp -a "${work}/web/."      artifacts/w0-web/
          mkdir -p artifacts/w0-web-licenses
          cp -a "${work}/licenses/." artifacts/w0-web-licenses/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w0-web-payload
          path: artifacts/
          retention-days: 1

  # ── Phase 1 ─────────────────────────────────────────────────────────────────
  baseline:
    name: Native Windows baseline
    runs-on: windows-latest
    # The FFmpeg dependency is real, not bureaucratic: FfmpegException is fatal
    # at startup and win25-vs2026 ships no ffmpeg at all, so without the spike's
    # output the server cannot start on this image and there is no baseline to
    # measure. Taking the encoder from the spike also keeps the whole chain
    # inside W0 and inside the pinned commit.
    needs: [web-payload, ffmpeg-spike]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      # Attribution guard. A pinned `ref:` says which commit was REQUESTED; this
      # says which commit is actually here. Without it a checkout that silently
      # resolved to something else -- a merge ref, a moved branch -- would still
      # produce confident-looking evidence.
      - name: Assert the evidence SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected : $env:W0_EVIDENCE_SHA"
          Write-Host "actual   : $actual"
          if ($actual -ne $env:W0_EVIDENCE_SHA) {
            throw "W0 HARD STOP: this job is standing in $actual, not the evidence SHA $env:W0_EVIDENCE_SHA."
          }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: w0-web-payload
          path: ${{ runner.temp }}\w0-web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: w0-ffmpeg-bin
          path: ${{ runner.temp }}\w0-ffmpeg-bin

      - name: Run the baseline probe
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'w0-work'
          $evidence = Join-Path $env:RUNNER_TEMP 'w0-evidence'
          New-Item -ItemType Directory -Force -Path $work, $evidence | Out-Null
          ./ci/windows/w0/probe-baseline.ps1 `
            -RepoRoot $PWD `
            -WorkRoot $work `
            -EvidenceDir $evidence `
            -HeadSha $env:W0_EVIDENCE_SHA `
            -WebPayloadDir (Join-Path $env:RUNNER_TEMP 'w0-web\w0-web') `
            -FfmpegDir (Join-Path $env:RUNNER_TEMP 'w0-ffmpeg-bin')

      - name: Summarise
        if: ${{ always() }}
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'w0-evidence\baseline.json'
          if (Test-Path $file) {
            $facts = (Get-Content $file -Raw | ConvertFrom-Json).facts
            "| fact | bucket |", "| --- | --- |" | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($f in $facts) { "| $($f.id) | $($f.bucket) |" | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w0-evidence-baseline
          path: ${{ runner.temp }}\w0-evidence
          retention-days: 3

  # ── Phases 2 and 3 ──────────────────────────────────────────────────────────
  #
  # One job on purpose: the installer experiment installs the same disposable
  # Generic Host spike the service probe builds, and an installer experiment that
  # installed a DIFFERENT payload would not be measuring the same lifecycle.
  service-and-installer:
    name: Service boundary and installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      # Attribution guard. A pinned `ref:` says which commit was REQUESTED; this
      # says which commit is actually here. Without it a checkout that silently
      # resolved to something else -- a merge ref, a moved branch -- would still
      # produce confident-looking evidence.
      - name: Assert the evidence SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected : $env:W0_EVIDENCE_SHA"
          Write-Host "actual   : $actual"
          if ($actual -ne $env:W0_EVIDENCE_SHA) {
            throw "W0 HARD STOP: this job is standing in $actual, not the evidence SHA $env:W0_EVIDENCE_SHA."
          }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Publish the server for the SCM probe
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'w0-publish'
          dotnet publish Tesserafin.Server/Tesserafin.Server.csproj `
            --configuration Release --runtime win-x64 --self-contained true --output $publish

      - name: Windows Service boundary probe
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'w0-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          ./ci/windows/w0/probe-service.ps1 `
            -PublishDir (Join-Path $env:RUNNER_TEMP 'w0-publish') `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'w0-work') `
            -EvidenceDir $evidence `
            -HeadSha $env:W0_EVIDENCE_SHA

      - name: Installer lifecycle experiment
        shell: pwsh
        run: |
          ./ci/windows/w0/probe-installer.ps1 `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'w0-work') `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'w0-evidence') `
            -HeadSha $env:W0_EVIDENCE_SHA

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w0-evidence-service-installer
          path: ${{ runner.temp }}\w0-evidence
          retention-days: 3

  # ── Phase 4 ─────────────────────────────────────────────────────────────────
  ffmpeg-spike:
    name: Native Windows FFmpeg source-build spike
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Pinned by the SAME commit the pinned upstream tree itself pins in
      # .github/workflows/_meta_win_clang_portable.yaml, so the spike runs the
      # upstream mechanism rather than an approximation of it.
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          update: true
          msystem: CLANG64
          install: >-
            git
            make
            diffutils
            quilt
            python
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-nasm

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      # Attribution guard. A pinned `ref:` says which commit was REQUESTED; this
      # says which commit is actually here. Without it a checkout that silently
      # resolved to something else -- a merge ref, a moved branch -- would still
      # produce confident-looking evidence.
      - name: Assert the evidence SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected : $env:W0_EVIDENCE_SHA"
          Write-Host "actual   : $actual"
          if ($actual -ne $env:W0_EVIDENCE_SHA) {
            throw "W0 HARD STOP: this job is standing in $actual, not the evidence SHA $env:W0_EVIDENCE_SHA."
          }

      - name: Feasibility spike from the pinned source
        env:
          FFMPEG_COMMIT: ${{ env.FFMPEG_COMMIT }}
          W0_EVIDENCE_SHA: ${{ env.W0_EVIDENCE_SHA }}
        run: |
          export EVIDENCE_DIR="$(cygpath -u "${RUNNER_TEMP}")/w0-ffmpeg-evidence"
          export WORK_DIR="$(cygpath -u "${RUNNER_TEMP}")/w0-ffmpeg"
          bash ci/windows/w0/spike-ffmpeg.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w0-evidence-ffmpeg
          path: ${{ runner.temp }}\w0-ffmpeg-evidence
          retention-days: 3

      # The binaries themselves, so the baseline job can start the server at all.
      # Short retention and probe-only: #234 forbids an expiring Actions artifact
      # from ever becoming a production input, and this one never does -- W1
      # produces the accepted runtime and packaging consumes it by digest.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w0-ffmpeg-bin
          path: ${{ runner.temp }}\w0-ffmpeg-evidence\bin
          # The default is `warn`, which uploads nothing and still reports
          # success. That happened once: the spike job went green having produced
          # no binaries, and the baseline job three steps later failed with
          # "Artifact not found". An empty artifact is a failure here.
          if-no-files-found: error
          retention-days: 1

  # ── The Windows test verdict, as a comparison rather than a slogan ──────────
  #
  # Runs the identical `Tests` command on BOTH the immutable PR head and the
  # pull request's base commit, keeps the structured results, and compares the
  # failing-test SET. See ci/windows/w0/Compare-W0TestBaseline.ps1 for why a
  # count is not the question.
  #
  # The matrix legs deliberately do NOT fail on test failures: the suite is red
  # on both trees and W0 neither caused that nor may fix it. They record. The
  # gate that follows is what can fail, and it fails on a CHANGED failure set --
  # which an architecture-only pull request must never produce.
  windows-tests:
    name: Server test suite on native Windows (${{ matrix.tree }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: head
            sha: ${{ github.event.pull_request.head.sha || github.sha }}
          - tree: base
            # The base COMMIT, pinned -- not the `master` branch name. A
            # floating ref would let master move mid-run and silently change
            # what the head was compared against.
            sha: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Assert the checked-out SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected : ${{ matrix.sha }}"
          Write-Host "actual   : $actual"
          if ($actual -ne "${{ matrix.sha }}") {
            throw "W0 HARD STOP: this leg is standing in $actual, not ${{ matrix.sha }}."
          }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Byte-identical between the two legs apart from `--results-directory`.
      # A filter that differed would make the set comparison meaningless.
      #
      # The real exit code is CAPTURED rather than discarded: `continue-on-error`
      # threw away the one number that says whether the run itself completed.
      - name: Run DotNet CLI Tests
        id: tests
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'w0-trx'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          dotnet test Tesserafin.sln `
            --configuration Release `
            --filter 'Category!=Smoke' `
            --verbosity minimal `
            --logger "trx" `
            --results-directory $results
          $code = $LASTEXITCODE
          Write-Host "dotnet test exit code: $code"
          "exitCode=$code" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          # Deliberately not rethrown. A red suite is the MEASUREMENT here; the
          # comparison job decides whether it is acceptable. A missing TRX is a
          # different matter and the comparison script hard-stops on it.
          exit 0

      - name: Record the exit code beside the results
        if: ${{ always() }}
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'w0-trx'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          "${{ steps.tests.outputs.exitCode }}" |
            Set-Content -LiteralPath (Join-Path $results 'exit-code.txt') -Encoding utf8NoBOM

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w0-trx-${{ matrix.tree }}
          path: ${{ runner.temp }}\w0-trx
          if-no-files-found: error
          retention-days: 3

  windows-test-baseline:
    name: Windows failing-test set matches the base
    runs-on: windows-latest
    needs: [windows-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Assert the evidence SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "expected : $env:W0_EVIDENCE_SHA"
          Write-Host "actual   : $actual"
          if ($actual -ne $env:W0_EVIDENCE_SHA) {
            throw "W0 HARD STOP: this job is standing in $actual, not the evidence SHA $env:W0_EVIDENCE_SHA."
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: w0-trx-head
          path: ${{ runner.temp }}\trx-head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: w0-trx-base
          path: ${{ runner.temp }}\trx-base

      - name: Compare the failing-test sets
        shell: pwsh
        run: |
          $headExit = -1
          $baseExit = -1
          $headExitFile = Join-Path $env:RUNNER_TEMP 'trx-head\exit-code.txt'
          $baseExitFile = Join-Path $env:RUNNER_TEMP 'trx-base\exit-code.txt'
          if (Test-Path -LiteralPath $headExitFile) { $headExit = [int](Get-Content -LiteralPath $headExitFile -Raw).Trim() }
          if (Test-Path -LiteralPath $baseExitFile) { $baseExit = [int](Get-Content -LiteralPath $baseExitFile -Raw).Trim() }

          ./ci/windows/w0/Compare-W0TestBaseline.ps1 `
            -HeadResultsDir (Join-Path $env:RUNNER_TEMP 'trx-head') `
            -BaseResultsDir (Join-Path $env:RUNNER_TEMP 'trx-base') `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'w0-evidence') `
            -HeadSha $env:W0_EVIDENCE_SHA `
            -BaseSha "${{ github.event.pull_request.base.sha || github.sha }}" `
            -HeadExitCode $headExit `
            -BaseExitCode $baseExit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w0-evidence-windows-tests
          path: ${{ runner.temp }}\w0-evidence
          retention-days: 3

  # ── Static analysis and unit tests for the probe harness itself ─────────────
  probe-selftest:
    name: Probe harness analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W0_EVIDENCE_SHA }}
          persist-credentials: false

      # Attribution guard. A pinned `ref:` says which commit was REQUESTED; this
      # says which commit is actually here. Without it a checkout that silently
      # resolved to something else -- a merge ref, a moved branch -- would still
      # produce confident-looking evidence.
      - name: Assert the evidence SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected : ${W0_EVIDENCE_SHA}"
          echo "actual   : ${actual}"
          if [ "${actual}" != "${W0_EVIDENCE_SHA}" ]; then
            echo "W0 HARD STOP: this job is standing in ${actual}, not the evidence SHA ${W0_EVIDENCE_SHA}." >&2
            exit 1
          fi

      - name: PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

          $findings = Invoke-ScriptAnalyzer -Path ./ci/windows/w0 -Recurse `
            -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { throw "PSScriptAnalyzer reported $($findings.Count) finding(s)." }

          $config = New-PesterConfiguration
          $config.Run.Path = './ci/windows/w0/tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Shell lint the spike
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck ci/windows/w0/spike-ffmpeg.sh
