name: Add to Reefin project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: add-to-project-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add issue or PR to project
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is required so fork PRs also get a token; this job never
      # checks out or executes PR code, so the elevated context is not exposed.
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/all3f0r1/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
