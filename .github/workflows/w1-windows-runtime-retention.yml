# Validation for the win-x64 FFmpeg runtime retention contract (#236, W1-A4).
#
# This workflow CANNOT publish. There is no `packages: write` at any level, no
# registry login, no secret beyond the default read-only token, and no branch or
# input under which a publication path becomes reachable. Publication lives in
# w1-windows-runtime-publish.yml and runs only from trusted master.
#
# WHAT IT VALIDATES, AND WHY IT DOES NOT TOUCH THE REAL 260 MB UNIT.
#
# The accepted runtime lives in Actions artifacts from run 32750491696, which
# EXPIRE on 2026-09-23. A gate built on those artifacts would pass until they
# expire and then either fail for an unrelated reason or, worse, quietly stop
# checking. That is exactly the staleness failure W1-A3's O-1 observation
# named, and reproducing it here would be a choice, not an accident.
#
# So the identity of the real unit is verified WITHOUT the real unit: the
# expected OCI manifest digest is a pure function of the committed acceptance
# manifest, and `retention.expected_manifest_digest` recomputes it from those
# committed bytes alone. Everything else — determinism, the layer format, the
# consumer's refusals, the registry protocol — is structural, so it is exercised
# against a generated fixture of the same shape. Neither depends on an artifact
# that can expire.

name: W1 Windows Runtime Retention

on:
  pull_request:
    paths:
      - 'ci/windows/runtime-retention/**'
      - '.github/workflows/w1-windows-runtime-retention.yml'
      - '.github/workflows/w1-windows-runtime-publish.yml'
      - 'docs/distribution/W1-windows-runtime-retention.md'

# Read-only for the whole workflow, and never raised at job level. This is the
# validation half; it has nothing to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # On `pull_request`, actions/checkout defaults to the synthetic merge ref,
  # which exists in no branch and changes whenever master moves. Evidence has to
  # name a commit that exists in the history being reviewed.
  W1A4_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  LC_ALL: C
  TZ: UTC

jobs:
  contract:
    name: Contract and controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Assert the evidence SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${W1A4_EVIDENCE_SHA}" ]; then
            echo "W1-A4 HARD STOP: standing in ${actual}, not ${W1A4_EVIDENCE_SHA}." >&2
            exit 1
          fi

      # PyYAML is not in the standard library, and `publication_policy.py` parses
      # the workflow rather than grepping it. "The runner probably has it" is not
      # a guarantee, and a checker that cannot import its parser must fail loudly
      # rather than be skipped.
      - name: Guarantee the YAML parser this validation depends on
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c "import yaml; print(f'PyYAML {yaml.__version__}')"

      - name: The committed acceptance manifest survives the closed schema
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 - <<'PY'
          import json
          import contract
          accepted = json.loads(open("accepted-runtime.json", "rb").read())
          contract.validate_accepted(accepted)
          print(f"accepted-runtime.json validates at {accepted['manifestDigest']}")
          PY

      # The load-bearing check, and the one that never goes stale: the expected
      # OCI manifest digest is RECOMPUTED from the committed manifest and must
      # equal the digest the manifest claims. No artifact, no registry, no
      # network. If someone edits a digest, a size, a media type or an
      # annotation-bearing field by hand, this disagrees.
      - name: The expected manifest digest is reconstructible from committed data alone
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 - <<'PY'
          import json
          import contract, retention
          accepted = json.loads(open("accepted-runtime.json", "rb").read())
          contract.validate_accepted(accepted)
          predicted = retention.expected_manifest_digest(accepted)
          for field in ("configDigest", "configSize", "manifestDigest", "manifestSize"):
              if predicted[field] != accepted[field]:
                  raise SystemExit(
                      f"W1-A4 HARD STOP: {field} recomputes to {predicted[field]!r}, but "
                      f"accepted-runtime.json records {accepted[field]!r}"
                  )
          print("the committed manifest describes itself consistently:")
          for field, value in predicted.items():
              print(f"  {field}: {value}")
          PY

      - name: Build the fixture
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 make-fixture.py --out "${RUNNER_TEMP}/fixture"

      - name: Hostile controls
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 negative-controls.py \
            --fixture "${RUNNER_TEMP}/fixture" \
            --json "${RUNNER_TEMP}/controls.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      # Controls 09, 10 and 11 used to grade RED through one shared token, so
      # none of them proved its own property. The matrix requires each to be
      # satisfied by its own mutation and by no other.
      - name: Controls 09, 10 and 11 grade on their own assertion
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 negative-controls.py \
            --fixture "${RUNNER_TEMP}/fixture" --ablate | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w1a4-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/controls.json
          if-no-files-found: warn
          retention-days: 14

  determinism:
    name: Deterministic layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Build the fixture
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 make-fixture.py --out "${RUNNER_TEMP}/fixture"

      # Two builds, in directories with different names. If a path, a clock or a
      # filesystem walk order ever reached the bytes, these disagree.
      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          ./build-twice.sh \
            --delivered  "${RUNNER_TEMP}/fixture/delivered" \
            --evidence-a "${RUNNER_TEMP}/fixture/evidence-a" \
            --evidence-b "${RUNNER_TEMP}/fixture/evidence-b" \
            --comparison "${RUNNER_TEMP}/fixture/comparison.json" \
            --accepted   "${RUNNER_TEMP}/fixture/accepted-runtime.json" \
            --work       "${RUNNER_TEMP}/twice" | tee -a "${GITHUB_STEP_SUMMARY}"

  registry:
    name: Registry protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      registry:
        # Pinned by immutable digest, like every other image this repository runs.
        image: registry@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      # The pinned client, verified by sha256 BEFORE it is unpacked. A
      # runner-preinstalled client is never accepted.
      - name: Install the pinned ORAS
        shell: bash
        run: ./ci/windows/build-inputs/install-oras.sh linux-amd64 "${RUNNER_TEMP}/bin"

      - name: Build the fixture and its layout
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 make-fixture.py --out "${RUNNER_TEMP}/fixture"
          python3 assemble.py \
            --delivered  "${RUNNER_TEMP}/fixture/delivered" \
            --evidence-a "${RUNNER_TEMP}/fixture/evidence-a" \
            --evidence-b "${RUNNER_TEMP}/fixture/evidence-b" \
            --comparison "${RUNNER_TEMP}/fixture/comparison.json" \
            --accepted   "${RUNNER_TEMP}/fixture/accepted-runtime.json" \
            --out        "${RUNNER_TEMP}/unit"
          python3 build-oci.py \
            --unit     "${RUNNER_TEMP}/unit" \
            --accepted "${RUNNER_TEMP}/fixture/accepted-runtime.json" \
            --out      "${RUNNER_TEMP}/oci"

      # A LOCAL registry, over plain HTTP, with no credential anywhere. This
      # proves the protocol without proving anything about ghcr.io, and it
      # deliberately cannot reach ghcr.io: there is no login step and no token.
      - name: Registry controls
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          cd ci/windows/runtime-retention
          ./registry-controls.sh \
            --oci  "${RUNNER_TEMP}/oci" \
            --repo localhost:5000/tesserafin-project/windows-ffmpeg-runtime \
            --work "${RUNNER_TEMP}/registry" | tee -a "${GITHUB_STEP_SUMMARY}"

  # A structural refusal, stated as a job rather than as a comment. If a future
  # edit adds `packages: write` or a registry login to THIS workflow, this fails
  # and names why.
  cannot-publish:
    name: This workflow cannot publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Guarantee the YAML parser this validation depends on
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c "import yaml; print(f'PyYAML {yaml.__version__}')"

      # The permission set is PARSED, not grepped. `permissions: write-all`
      # grants packages: write without containing the string, a quoted or inline
      # mapping reads differently to a line-oriented pattern, and a job block can
      # widen what the workflow level narrowed — none of which a regex can
      # answer. The closure is followed into repository-local scripts, so "this
      # workflow contains no push" stops being a claim about its own text.
      - name: This workflow resolves to a closed read-only permission set
        shell: bash
        run: |
          set -euo pipefail
          ./ci/windows/runtime-retention/assert-cannot-publish.sh \
            .github/workflows/w1-windows-runtime-retention.yml

      # The other direction, so the check above cannot pass vacuously. A scanner
      # that finds nothing everywhere is indistinguishable from one that is
      # broken, so it is pointed at the workflow that DOES publish and must
      # refuse it — for the exact publishing capability that workflow owns.
      - name: The same check refuses the publishing workflow
        shell: bash
        run: |
          set -euo pipefail
          if ./ci/windows/runtime-retention/assert-cannot-publish.sh \
               .github/workflows/w1-windows-runtime-publish.yml >/dev/null 2>&1; then
            echo "W1-A4 HARD STOP: the publication check accepted a workflow that publishes;" >&2
            echo "it would accept anything, and proves nothing about the validation half." >&2
            exit 1
          fi
          echo "the check refuses the publishing workflow, so its acceptance above means something"

      # Twelve fixtures, each required to reach ONE named property. A checker
      # that refuses everything passes the two checks above; it does not pass
      # these, because fixture 11 requires the pristine workflow to be ACCEPTED
      # and each of the other eleven names the property it must be refused for.
      - name: Semantic permission fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 permission-fixtures.py \
            --json "${RUNNER_TEMP}/permission-fixtures.json" | tee -a "${GITHUB_STEP_SUMMARY}"

  # The excluded subtree owns itself, and the build workflow cannot reach into
  # it. This job runs on retention-only changes, which is exactly when the W1
  # dual-runner workflow does NOT run — the two filters are complementary by
  # construction, and `pathfilter.py` proves that against GitHub's own semantics.
  boundary:
    name: The excluded subtree owns itself
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      - name: Guarantee the YAML parser this validation depends on
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c "import yaml; print(f'PyYAML {yaml.__version__}')"

      - name: Every file behind the exclusion has exactly one retention role
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 boundary.py | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: The exclusion matches GitHub path-filter semantics
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 pathfilter.py | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Hostile controls on the boundary
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 boundary-controls.py \
            --json "${RUNNER_TEMP}/boundary-controls.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: w1a4-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/boundary-controls.json
          if-no-files-found: warn
          retention-days: 14

  # One grammar, three languages, one corpus. R0 found the PowerShell consumer
  # still carrying the permissive shape the other two had been repaired for, and
  # nothing was comparing their decisions.
  references:
    name: Cross-language reference grammar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.W1A4_EVIDENCE_SHA }}
          persist-credentials: false

      # pwsh is preinstalled on ubuntu-latest. It is asserted rather than
      # assumed: without it the PowerShell leg would be silently skipped and
      # two-thirds of a corpus would be reported as a pass.
      - name: Assert the PowerShell host exists
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null || {
            echo "W1-A4 HARD STOP: pwsh is not on PATH; the PowerShell leg cannot be skipped" >&2
            exit 1
          }
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: One corpus, three parsers, identical decisions
        shell: bash
        run: |
          set -euo pipefail
          cd ci/windows/runtime-retention
          python3 reference-corpus.py \
            --json "${RUNNER_TEMP}/reference-corpus.json" | tee -a "${GITHUB_STEP_SUMMARY}"
