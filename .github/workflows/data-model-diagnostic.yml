name: Data model diagnostic
on:
  pull_request:
    paths:
      - 'tools/data_model/**'
      - 'docs/data-model-reference-diagnostic.md'
      - '.github/workflows/data-model-diagnostic.yml'
  push:
    branches: [master]
    paths:
      - 'tools/data_model/**'
      - '.github/workflows/data-model-diagnostic.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/data_model -p 'test_*.py' -v
