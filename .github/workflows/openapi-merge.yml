# PARKED — manual trigger only (issue #62). Not a pull-request check, but it
# is part of the openapi-* chain and hits the same allocation refusal: it went
# red on every push to master before its first step. Nothing is fixed here —
# the trigger is disarmed to stop permanent red on master.
# See docs/local-ci.md.
#
# Consequence to be aware of: the published/unstable OpenAPI spec is no longer
# updated automatically on master pushes or v* tags. The spec committed under
# openapi/ stays authoritative and is guarded by OpenApiContractTests in the
# local gate; publishing must be dispatched by hand, or the push/tag trigger
# restored, once allocation works again.
#
# Previous trigger: on: push (branches: master, tags: 'v*')
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: OpenAPI Publish
on:
  workflow_dispatch:

jobs:
  publish-openapi:
    name: OpenAPI - Publish Artifact
    uses: ./.github/workflows/openapi-generate.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      repository: ${{ github.repository }}
      artifact: openapi-head

  publish-unstable:
    name: OpenAPI - Publish Unstable Spec
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') && contains(github.repository_owner, 'reefin') }}
    runs-on: ubuntu-latest
    needs:
    - publish-openapi
    steps:
      - name: Set unstable dated version
        id: version
        run: |-
          echo "TESSERAFIN_VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Download openapi-head
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-head
          path: openapi-head
      - name: Upload openapi.json (unstable) to repository server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: openapi-head/openapi.json
          strip_components: 1
          target: "/srv/incoming/openapi/unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}"
      - name: Move openapi.json (unstable) into place
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            if ! test -d /run/workflows; then
                sudo mkdir -p /run/workflows
                sudo chown ${{ secrets.REPO_USER }} /run/workflows
            fi
            (
            flock -x -w 300 200 || exit 1
            TGT_DIR="/srv/repository/main/openapi"
            LAST_SPEC="$( ls -lt ${TGT_DIR}/unstable/ | grep 'reefin-openapi' | head -1 | awk '{ print $NF }' )"
            # If new and previous spec don't differ (diff retcode 0), remove incoming and finish
            if diff /srv/incoming/openapi/unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}/openapi.json ${TGT_DIR}/unstable/${LAST_SPEC} &>/dev/null; then
                rm -r /srv/incoming/openapi/unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}
                exit 0
            fi
            # Move new spec into place
            sudo mv /srv/incoming/openapi/unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}/openapi.json ${TGT_DIR}/unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}.json
            # Delete previous reefin-openapi-unstable_previous.json
            sudo rm ${TGT_DIR}/reefin-openapi-unstable_previous.json
            # Move current reefin-openapi-unstable.json symlink to reefin-openapi-unstable_previous.json
            sudo mv ${TGT_DIR}/reefin-openapi-unstable.json ${TGT_DIR}/reefin-openapi-unstable_previous.json
            # Create new reefin-openapi-unstable.json symlink
            sudo ln -s unstable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}.json ${TGT_DIR}/reefin-openapi-unstable.json
            # Check that the previous openapi unstable spec link is correct
            if [[ "$( readlink ${TGT_DIR}/reefin-openapi-unstable_previous.json )" != "unstable/${LAST_SPEC}" ]]; then
                sudo rm ${TGT_DIR}/reefin-openapi-unstable_previous.json
                sudo ln -s unstable/${LAST_SPEC} ${TGT_DIR}/reefin-openapi-unstable_previous.json
            fi
            ) 200>/run/workflows/openapi-unstable.lock

  publish-stable:
    name: OpenAPI - Publish Stable Spec
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.repository_owner, 'reefin') }}
    runs-on: ubuntu-latest
    needs:
    - publish-openapi
    steps:
      - name: Set version number
        id: version
        run: |-
          echo "TESSERAFIN_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Download openapi-head
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-head
          path: openapi-head
      - name: Upload openapi.json (stable) to repository server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          source: openapi-head/openapi.json
          strip_components: 1
          target: "/srv/incoming/openapi/stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}"
      - name: Move openapi.json (stable) into place
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: "${{ secrets.REPO_HOST }}"
          username: "${{ secrets.REPO_USER }}"
          key: "${{ secrets.REPO_KEY }}"
          debug: false
          script: |
            if ! test -d /run/workflows; then
                sudo mkdir -p /run/workflows
                sudo chown ${{ secrets.REPO_USER }} /run/workflows
            fi
            (
            flock -x -w 300 200 || exit 1
            TGT_DIR="/srv/repository/main/openapi"
            LAST_SPEC="$( ls -lt ${TGT_DIR}/stable/ | grep 'reefin-openapi' | head -1 | awk '{ print $NF }' )"
            # If new and previous spec don't differ (diff retcode 0), remove incoming and finish
            if diff /srv/incoming/openapi/stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}/openapi.json ${TGT_DIR}/stable/${LAST_SPEC} &>/dev/null; then
                rm -r /srv/incoming/openapi/stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}
                exit 0
            fi
            # Move new spec into place
            sudo mv /srv/incoming/openapi/stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}/openapi.json ${TGT_DIR}/stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}.json
            # Delete previous reefin-openapi-stable_previous.json
            sudo rm ${TGT_DIR}/reefin-openapi-stable_previous.json
            # Move current reefin-openapi-stable.json symlink to reefin-openapi-stable_previous.json
            sudo mv ${TGT_DIR}/reefin-openapi-stable.json ${TGT_DIR}/reefin-openapi-stable_previous.json
            # Create new reefin-openapi-stable.json symlink
            sudo ln -s stable/reefin-openapi-${{ env.TESSERAFIN_VERSION }}.json ${TGT_DIR}/reefin-openapi-stable.json
            # Check that the previous openapi stable spec link is correct
            if [[ "$( readlink ${TGT_DIR}/reefin-openapi-stable_previous.json )" != "stable/${LAST_SPEC}" ]]; then
                sudo rm ${TGT_DIR}/reefin-openapi-stable_previous.json
                sudo ln -s stable/${LAST_SPEC} ${TGT_DIR}/reefin-openapi-stable_previous.json
            fi
            ) 200>/run/workflows/openapi-stable.lock
