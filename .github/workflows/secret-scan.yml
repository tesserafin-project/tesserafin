# Fail-closed secret scanning — repository-owned slice of #172 (C3).
#
# This workflow DETECTS a committed secret. It does not prevent one. By the time
# any job here starts, GitHub has already accepted the push and the object is
# already in the repository. Preventing the push needs GitHub-native push
# protection, which needs GitHub Secret Protection, which a private repository on
# a free organisation plan does not have. That gap is tracked by #96 and
# #94 and is NOT closed by this file. Nothing here may be described as
# push protection.
#
# NO THIRD-PARTY SECRET-SCANNING ACTION. `gitleaks/gitleaks-action` is a mutable
# tag and, since v2, requires a licence key for organisation-owned repositories.
# This workflow takes no secret of any kind — there is nothing for a compromised
# action to exfiltrate, and nothing to rotate. The scanner is a release archive
# pinned by version, release commit and SHA-256, verified before it is executed.
#
# NO SARIF UPLOAD, NO CODE-SCANNING API, NO SECRET-SCANNING API. All three need
# GitHub Advanced Security on a private repository. The verdict is therefore the
# job status itself, plus a sanitized artifact — both of which work on this plan.
#
# WHY A SCHEDULE. Unlike a test suite, this gate's inputs include the scanner's
# ruleset and the repository's complete history, neither of which changes only
# when someone pushes. The weekly run is what keeps "the default branch was clean
# when we last touched it" from being mistaken for "the default branch is clean".

name: Secret Scan

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    # Tuesdays 05:23 UTC. Off the hour, and offset from this repository's dependency audit so the two do not contend for the same free-plan minutes.
    - cron: "23 5 * * 2"
  # Diagnostics only. A manual run can never be evidence that the automatic
  # triggers work, and is never accepted as such.
  workflow_dispatch:

# Read-only, at the top level and again on every job. This workflow has no
# reason to write anything: no comment, no status, no release, no code-scanning
# upload. `pull_request_target` is deliberately NOT used — it would run this
# repository's workflow definition with a writable token against a fork's code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request runs are cancelled; push and scheduled runs are not.
  # A cancelled push run would destroy exactly the post-merge evidence this
  # workflow exists to produce.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEFAULT_BRANCH: master
  REPO_NAME: tesserafin
  # Floors, not equalities. Branch counts move as Dependabot opens and closes
  # pull requests, so an equality check would go red for a reason that has
  # nothing to do with secrets. A collapsed commit count, by contrast, can only
  # mean a truncated fetch.
  MIN_COMMITS: "25000"
  MIN_REFS: "10"
  GITLEAKS_BIN_DIR: /tmp/tesserafin-gitleaks

jobs:
  # ------------------------------------------------------------------
  # 1. Deterministic controls.
  #
  # These run BEFORE any live scan, on the same runner image that will judge the
  # change. Inside them, negative controls are SUPPOSED to go red: each asserts
  # both the exit status and the classification the evaluator announced. This job
  # going green therefore means the evaluator refuses in every way it must —
  # missing scanner, wrong version, bad checksum, crash, timeout, unknown flag,
  # missing report, malformed report, contradictory exit code, and every invalid
  # baseline shape. A green Controls job is the licence to believe jobs 2 and 3.
  # ------------------------------------------------------------------
  controls:
    name: Controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The pull request's own head, never the merge commit GitHub
          # synthesises: the merge commit is not what gets merged, and a verdict
          # produced from it cannot be attributed to a reviewable SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned scanner
        run: ./ci/install-gitleaks.sh

      - name: Run the deterministic controls
        # --no-live because the live scans are jobs 2 and 3, run once rather
        # than twice.
        run: ./ci/tests/secret-scan.test.sh --no-live

  # ------------------------------------------------------------------
  # 2. Current-tree scan.
  #
  # Deliberately performed on a pristine checkout, before any dependency install
  # or build. node_modules, bin/ and obj/ hold third-party and compiled content
  # that is not this repository's, and a scan that includes them answers a
  # different question. ci/secret-scan.sh refuses outright if it finds them.
  # ------------------------------------------------------------------
  current-tree:
    name: Current tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Everything this gate concludes is attributed to a SHA, so the SHA is
      # checked rather than assumed: that the checkout IS the event's real head,
      # that the history is not truncated, that the default branch is present
      # locally, and — for a pull request — that the head matches what GitHub
      # itself serves at refs/pull/<n>/head. actions/checkout leaves HEAD
      # detached, which is exactly the case a `--branches`-only scan would miss.
      - name: Verify the checkout is complete and is the event's real head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "checked out $actual but the event's head is $EXPECTED_SHA" >&2
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "the checkout is shallow; a truncated history cannot be scanned completely" >&2
            exit 1
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            served="$(git ls-remote origin "refs/pull/${PR_NUMBER}/head" | cut -f1)"
            if [ "$served" != "$actual" ]; then
              echo "refs/pull/${PR_NUMBER}/head is $served but the checkout is $actual" >&2
              exit 1
            fi
            echo "pull request head verified against refs/pull/${PR_NUMBER}/head: $served"
          fi
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "HEAD is attached to $(git symbolic-ref --short HEAD)"
          else
            echo "HEAD is detached at $actual; ci/secret-scan.sh records it as an explicit ref before scanning"
          fi
          echo "event=${{ github.event_name }} sha=$actual refs=$(git for-each-ref | wc -l) commits=$(git rev-list --all --count)"

      - name: Install the pinned scanner
        run: ./ci/install-gitleaks.sh

      - name: Scan the checked-out tree
        run: |
          mkdir -p artifacts/secret-scan
          ./ci/secret-scan.sh --mode tree \
            --repo-name "$REPO_NAME" \
            --out artifacts/secret-scan \
            --summary artifacts/secret-scan/tree-summary.md

      - name: Publish the tree summary
        if: ${{ always() }}
        run: |
          if [ -f artifacts/secret-scan/tree-summary.md ]; then
            cat artifacts/secret-scan/tree-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Secret scan — current tree — INDETERMINATE"
              echo ""
              echo "The scan produced no summary; it failed before it reached a verdict."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only the sanitized report. The raw report never leaves the temporary
      # directory ci/secret-scan.sh created for it, is mode 0600 for its whole
      # life, and is removed by a trap.
      - name: Retain the sanitized tree report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secret-scan/secret-scan-tree.json
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. Complete-history and baseline scan.
  # ------------------------------------------------------------------
  history:
    name: Complete history and baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The complete history, not a truncation. ci/secret-scan.sh refuses to
          # reach a verdict on a shallow repository rather than reporting the
          # zero findings a truncated history would produce.
          fetch-depth: 0

      - name: Fetch every branch and tag explicitly
        run: |
          set -euo pipefail
          git fetch --no-recurse-submodules --prune --tags --force origin \
            "+refs/heads/*:refs/remotes/origin/*"
          printf 'refs after the explicit fetch: %s\n' "$(git for-each-ref | wc -l)"
          printf 'reachable commits: %s\n' "$(git rev-list --all --count)"

      # Everything this gate concludes is attributed to a SHA, so the SHA is
      # checked rather than assumed: that the checkout IS the event's real head,
      # that the history is not truncated, that the default branch is present
      # locally, and — for a pull request — that the head matches what GitHub
      # itself serves at refs/pull/<n>/head. actions/checkout leaves HEAD
      # detached, which is exactly the case a `--branches`-only scan would miss.
      - name: Verify the checkout is complete and is the event's real head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "checked out $actual but the event's head is $EXPECTED_SHA" >&2
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "the checkout is shallow; a truncated history cannot be scanned completely" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            echo "the default branch ref refs/remotes/origin/$DEFAULT_BRANCH is not present locally" >&2
            exit 1
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            served="$(git ls-remote origin "refs/pull/${PR_NUMBER}/head" | cut -f1)"
            if [ "$served" != "$actual" ]; then
              echo "refs/pull/${PR_NUMBER}/head is $served but the checkout is $actual" >&2
              exit 1
            fi
            echo "pull request head verified against refs/pull/${PR_NUMBER}/head: $served"
          fi
          if git symbolic-ref -q HEAD >/dev/null; then
            echo "HEAD is attached to $(git symbolic-ref --short HEAD)"
          else
            echo "HEAD is detached at $actual; ci/secret-scan.sh records it as an explicit ref before scanning"
          fi
          echo "event=${{ github.event_name }} sha=$actual refs=$(git for-each-ref | wc -l) commits=$(git rev-list --all --count)"

      - name: Install the pinned scanner
        run: ./ci/install-gitleaks.sh

      - name: Validate the baseline artefacts
        run: |
          ./ci/secret-scan.sh --mode baseline --repo-name "$REPO_NAME"

      - name: Scan the complete history against the baseline
        run: |
          mkdir -p artifacts/secret-scan
          ./ci/secret-scan.sh --mode history \
            --repo-name "$REPO_NAME" \
            --default-branch "$DEFAULT_BRANCH" \
            --min-commits "$MIN_COMMITS" \
            --min-refs "$MIN_REFS" \
            --out artifacts/secret-scan \
            --summary artifacts/secret-scan/history-summary.md

      - name: Publish the history summary
        if: ${{ always() }}
        run: |
          if [ -f artifacts/secret-scan/history-summary.md ]; then
            cat artifacts/secret-scan/history-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Secret scan — complete history — INDETERMINATE"
              echo ""
              echo "The scan produced no summary; it failed before it reached a verdict."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain the sanitized history report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secret-scan/secret-scan-history.json
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # 4. Sanitized publication.
  #
  # Runs even when a scan above went red — a report that exists only on success
  # is useless for the case it matters most. It re-checks, on the published
  # bytes rather than on the producing code, that every finding carries only the
  # permitted fields and that no synthetic control value appears anywhere.
  # ------------------------------------------------------------------
  publish:
    name: Sanitized report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [current-tree, history]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: secret-scan-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
          merge-multiple: true

      - name: Assert the published reports are sanitized
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(incoming/*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No sanitized report was produced; a scan above failed before publication." >&2
            exit 1
          fi
          allowed='["baselineStatus","classification","commit","fingerprint","line","path","ruleId"]'
          status=0
          for r in "${reports[@]}"; do
            if ! jq -e --argjson a "$allowed" \
                 '[.findings[]? | keys | sort] | all(. == ($a|sort))' "$r" >/dev/null; then
              echo "$r carries a field outside the permitted set" >&2
              status=1
            fi
            for forbidden in Secret Match Entropy Author Email Message Description Link; do
              if jq -e --arg k "$forbidden" '[.findings[]? | has($k)] | any' "$r" >/dev/null 2>&1; then
                echo "$r carries the forbidden field $forbidden" >&2
                status=1
              fi
            done
            # The controls' synthetic values must not appear in anything
            # published. Checked on the bytes, not inferred from the code.
            #
            # DO NOT "TIDY" THE QUOTING BELOW. Each probe is split at a quote
            # seam ('AK''IA…') so that the literal never exists contiguously in
            # this file. Joining them would make the secret scan flag its own
            # workflow, and would put a credential-shaped token in this
            # repository's permanent history.
            for probe in 'AK''IAQRSTUVWXYZ234567' 'gh''p_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8' 'BEGIN PRIVATE KEY'; do
              if grep -qF -- "$probe" "$r"; then
                echo "$r contains a synthetic control value" >&2
                status=1
              fi
            done
          done
          exit $status

      - name: Summarise
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Secret scan — sanitized reports"
            echo ""
            echo "| report | verdict | findings |"
            echo "| --- | --- | --- |"
            for r in incoming/*.json; do
              [ -f "$r" ] || continue
              printf '| `%s` | %s | %s |\n' "$(basename "$r")" \
                "$(jq -r '.verdict' "$r")" "$(jq -r '.findings | length' "$r")"
            done
            echo ""
            echo "Raw reports are never published: they live only in a mode-0600 temporary"
            echo "directory and are removed by a trap. The reports above carry a rule ID, a"
            echo "repository-relative path, a line number, a commit, a fingerprint, a"
            echo "classification and a baseline status — and no value, match, source line,"
            echo "entropy, author, e-mail or commit message."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the combined sanitized report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/
          if-no-files-found: warn
          retention-days: 7
