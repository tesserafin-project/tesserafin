# Cron disarmed — manual trigger only (issue #62). This has no repository
# guard and runs on a hosted runner, so under the current allocation refusal
# it produced one failed run per day, before its first step, forever. It is
# not a pull-request check, but it is pure noise and it keeps requesting an
# allocation that is being denied. Nothing is fixed here; the schedule is
# removed and workflow_dispatch (already present) is kept. See docs/local-ci.md.
#
# Previous trigger: on: schedule ('30 1 * * *') + workflow_dispatch
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: Stale Issue Labeler

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  actions: write

jobs:
  issues:
    name: Check for stale issues
    runs-on: ubuntu-latest
    if: ${{ contains(github.repository, 'jellyfin/') }}
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          repo-token: ${{ secrets.JF_BOT_TOKEN }}
          ascending: true
          days-before-stale: 120
          days-before-pr-stale: -1
          days-before-close: 21
          days-before-pr-close: -1
          operations-per-run: 500
          exempt-issue-labels: regression,security,roadmap,future,feature,enhancement,confirmed
          stale-issue-label: stale
          stale-issue-message: |-
            This issue has gone 120 days without an update and will be closed within 21 days if there is no new activity. To prevent this issue from being closed, please confirm the issue has not already been fixed by providing updated examples or logs.

            If you have any questions you can use one of several ways to [contact us](https://jellyfin.org/contact).
          close-issue-message: |-
            This issue was closed due to inactivity.
