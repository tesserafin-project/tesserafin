# RESTORED on 2026-08-01 (#94, #180). The blocker recorded in the parking stamp
# below was never allocation and never code: code scanning requires GitHub
# Advanced Security, which a PRIVATE repository on a free organisation plan does
# not have. This repository is now PUBLIC, and code scanning is free on public
# repositories.
#
#   $ gh api repos/tesserafin-project/tesserafin -q '{visibility,private}'
#   {"visibility":"public","private":false}
#
# ADVANCED SETUP, NOT DEFAULT SETUP. Default setup runs the `default` query
# suite and offers no way to pin `security-extended`. #94's gate names
# `security-extended` explicitly, so the workflow stays advanced setup and the
# suite is declared here, in a file, at the exact commit that is analysed.
#
# LANGUAGE COVERAGE, and why it is what it is.
#
#   csharp   — the production language. 2473 tracked `.cs` files; GitHub's own
#              linguist reports 12.2 MB of C#. Built explicitly (see below).
#   actions  — the workflow definitions themselves. This repository is now
#              public, so any stranger can open a pull request that touches
#              `.github/`. Scanning that surface is not optional here: an
#              inherited upstream workflow that interpolated
#              `github.event.issue.comments_url` straight into a `run:` block
#              was removed in the pre-public hardening pass precisely because
#              nothing automatic was looking at it.
#
# NOT covered, stated rather than silently omitted:
#
#   javascript-typescript — the only two tracked `.ts` files in this repository
#              are `docker/browser-gate/playwright.config.ts` and
#              `docker/browser-gate/tests/onboarding.spec.ts`: the container
#              browser gate's Playwright config and its single spec. They are
#              test tooling, they ship in no artifact, and they are not a
#              production language "actually present" in the sense #94 means.
#              The browser client is a separate repository with its own CodeQL
#              workflow covering javascript-typescript.
#   Shell, HTML, Dockerfile, HCL, CSS — not CodeQL-supported languages.
#
# NOT autobuild. Autobuild fails on this solution (run 30230125535): it installs
# its own SDK, cannot find 10.0.0, then builds projects out of order and dies on
# CS0234 in Tesserafin.Model, ending on "Could not auto-detect a suitable build
# method". Building the solution explicitly with the SDK set up above is what
# GitHub's own error message prescribes, and it is the same build the local gate
# runs.
#
# NO `continue-on-error`, anywhere. A CodeQL job that cannot initialise, cannot
# build or cannot upload must be red. A green tick that means "the analysis did
# not happen" is the failure mode this workflow exists to prevent.
#
# ── Parking stamp (historical) ────────────────────────────────────────────
# PARKED 2026-07-19 — manual trigger only (#62, then #94). First cause: an
# account-wide GitHub Actions allocation refusal (free plan + private repo,
# 2000 min/month drained, $0 spending limit). That cause cleared on 2026-07-27.
# Second cause, which outlived it: Advanced Security is unavailable on a private
# repository under a free organisation plan, so the analysis ran and the upload
# was refused —
#   $ gh api repos/tesserafin-project/tesserafin/code-scanning/alerts
#   {"message":"Advanced Security must be enabled for this repository to use
#    code scanning.","status":"403"}
# and, in the sibling web repository (run 30230774481), after "Initialize
# CodeQL" and "Autobuild" both succeeded:
#   ##[error]Please verify that the necessary features are enabled: Advanced
#   Security must be enabled for this repository to use code scanning.
# Both causes are now gone.
# ───────────────────────────────────────────────────────────────────────────

name: "CodeQL"

on:
  push:
    branches: [master]
    # NO paths-ignore. A documentation-only exclusion on a security analysis is
    # a blind spot with a schedule attached.
  pull_request:
    branches: [master]
  schedule:
    # Thursdays 02:24 UTC — the trigger this workflow carried before it was
    # parked, restored verbatim.
    - cron: '24 2 * * 4'
  workflow_dispatch:

# Minimal and explicit. `actions: read` is the only permission beyond the two
# the analysis strictly needs: the CodeQL action reads its own run metadata
# through it, and without it every step logs "Failed to gather information for
# telemetry: Resource not accessible by integration".
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      # The barrier model pack in .github/codeql/extensions is repository-local and
      # UNPUBLISHED, by design (#203): publishing it to a registry would put a
      # security-relevant analysis input outside this repository's review.
      #
      # An unpublished pack cannot be named in `packs:` on its own — `codeql
      # database init` resolves pack names against the GitHub Container registry
      # and dies with a 403. The CLI's documented answer to that is a per-user
      # configuration file, so this writes one, scoped to the two subcommands
      # that need it and to nothing else.
      #
      # The two lines are not interchangeable, measured against this CLI:
      # `database init` finds a model pack through --search-path, `database
      # run-queries` does not and needs --additional-packs. Getting only the first
      # right produces a green init followed by
      #   ERROR: Could not find extension pack 'tesserafin/csharp-log-barriers'
      # at query time. Repeated --additional-packs values accumulate, so this does
      # not displace the action's own pr-diff-range pack.
      #
      # Deleting the pack does NOT make this silently green: `packs:` below still
      # names it, so init fails with the registry 403 and the job is red.
      - name: Point CodeQL at the repository-local model pack
        if: matrix.language == 'csharp'
        run: |
          mkdir -p "$HOME/.config/codeql"
          {
            printf 'database init --search-path %s\n' \
              "$GITHUB_WORKSPACE/.github/codeql/extensions"
            printf 'database run-queries --additional-packs %s\n' \
              "$GITHUB_WORKSPACE/.github/codeql/extensions"
          } > "$HOME/.config/codeql/config"
          cat "$HOME/.config/codeql/config"

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          packs: ${{ matrix.language == 'csharp' && 'tesserafin/csharp-log-barriers@0.0.1' || '' }}

      # Copied out now because the verification below runs after the analysis, and
      # the CodeQL action is free to clean the database up in between. `cp` fails
      # the job if init never wrote these, which is the correct outcome.
      - name: Snapshot the analysis configuration CodeQL initialised
        if: matrix.language == 'csharp'
        run: |
          DB="${{ runner.temp }}/codeql_databases/csharp"
          SNAPSHOT="${{ runner.temp }}/codeql-model-snapshot"
          mkdir -p "$SNAPSHOT"
          cp "$DB/temp/analysisConfig.json" "$SNAPSHOT/analysisConfig.json"
          cp -r "$DB/temp/extension-pack" "$SNAPSHOT/extension-pack"
          cat "$SNAPSHOT/analysisConfig.json"

      - name: Build solution for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build Tesserafin.sln --configuration Release -clp:ErrorsOnly

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

      # AFTER the analysis, on purpose. Placed before it, a disabled model pack
      # would end the job before any analysis ran, and "the analysis completed and
      # the five flows came back" — the observation that proves absence cannot
      # become a silent green — would be unobservable. Placed here, a pack that
      # stopped applying produces a completed analysis in which the suppressed
      # alerts REAPPEAR, and a red required job on top of it.
      #
      # NO `continue-on-error`, deliberately: see the header of this file. A model
      # pack that stopped applying must fail the required job, not warn in a log.
      - name: Verify the CodeQL barrier model pack
        if: matrix.language == 'csharp'
        run: ./ci/verify-codeql-model-pack.sh
          "${{ steps.init.outputs.codeql-path }}"
          "${{ runner.temp }}/codeql-model-snapshot"
