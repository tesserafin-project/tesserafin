# PARKED — manual trigger only (issue #62). Same allocation refusal as the
# other hosted workflows: red on every pull request and every push to master
# before the first step, plus a weekly cron that failed the same way and kept
# burning allocation attempts for nothing. Nothing is fixed here — the trigger
# is disarmed to stop the noise. See docs/local-ci.md.
#
# Loss of coverage is real and accepted for the duration of the outage: no
# static security analysis runs while this is parked. The local gate does NOT
# replace CodeQL. Restoring this is part of the return-to-normal checklist.
#
# Previous trigger: on: push (master) + pull_request (master) + schedule
# ('24 2 * * 4')
#
# ── Parking stamp ──────────────────────────────────────────────────────────
# Parked on : 2026-07-19
# Cause     : external, account-wide. GitHub refuses runner allocation before
#             the first step. all3f0r1 = free plan, all3f0r1/reefin = PRIVATE,
#             so Actions minutes are metered against a 2000 min/month
#             ACCOUNT-WIDE allowance. July 2026 weighted usage ~2646 min
#             (Linux 634 x1 + Windows 266 x2 + macOS 148 x10), drained mostly
#             by another repo. Spending limit is $0, so the overage is refused
#             rather than billed.
# Evidence  : run 29695198403 (ABI Compatibility) and run 29695198446
#             (OpenAPI Check), both `failure` in 3-4s with ZERO steps and no
#             annotations, while actions/permissions = {enabled: true,
#             allowed_actions: all} and every runs-on label is valid.
#             GET /actions/runners -> total_count: 0.
# Restore   : see the checklist in docs/local-ci.md (section 'Retour a la
#             normale'). The original trigger is recorded above verbatim.
# ───────────────────────────────────────────────────────────────────────────

name: "CodeQL"

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
