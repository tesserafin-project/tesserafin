name: "CodeQL"

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Read-only; the CodeQL action needs it for its own run metadata. Without
  # it every step logs "Failed to gather information for telemetry: Resource
  # not accessible by integration".
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended

    # NOT autobuild. Autobuild fails on this solution (run 30230125535): it
    # installs its own SDK, then builds projects out of order and dies on
    # CS0234 in Tesserafin.Model. Building the solution explicitly with the
    # SDK set up above is what GitHub's own error message prescribes, and it
    # is the same build the local gate runs.
    - name: Build solution for CodeQL
      run: dotnet build Tesserafin.sln --configuration Release -clp:ErrorsOnly

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
