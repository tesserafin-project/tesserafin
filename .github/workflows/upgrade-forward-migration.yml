name: Published forward migration

on:
  pull_request:
    paths:
      - '.github/workflows/upgrade-forward-migration.yml'
      - 'ci/upgrade/**'
      - 'docker/upgrade-roundtrip.sh'
      - 'docker/version-contract.sh'
      - 'SharedVersion.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-boundary:
    name: Published migration boundary
    # The historical baseline is in the private build package. Do not give a
    # fork's code package access; this is an evidence job, not a required context.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check preflight rejection controls (no Docker required)
        run: python3 -m unittest discover -s ci/upgrade -p 'test_*.py' -v

      - name: Authenticate for historical build images (read only)
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/upgrade-docker
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: Resolve published images and run the original preservation harness
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/upgrade-docker
        run: |
          set -o pipefail
          mkdir -p artifacts/forward-migration
          bash ci/upgrade/published-forward-migration.sh 2>&1 | tee artifacts/forward-migration/run.log

      - name: Retain evidence, including a failed image preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/forward-migration/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/upgrade-docker
        run: rm -rf -- "${DOCKER_CONFIG}"
